<title>Panel Distrisander</title>
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/playfair-latin.woff2) format('woff2')}

/* Panel de gestión Distrisander · sistema de diseño v2.
   Escritorio: menú lateral oscuro con íconos + contenido amplio. Celular: barra superior corta + barra inferior.
   Contraste AAA (7:1) en texto, foco visible en todo, tamaños de letra en rem (respetan el tamaño del sistema),
   movimiento con propósito y apagado si la persona pide «reducir movimiento». */
:root{--ink:#111;--ink2:#1c1a15;--gold:#C9A24B;--gold-2:#e6c473;--gold-d:#6b4d0e;--gold-l:#f4e9c9;--bg:#f6f3ec;--card:#fff;--line:#e8e1d2;--line2:#d6ccb5;
--mut:#4d473d;--ok:#245832;--bad:#7a2820;--warn:#5f4200;--ok-bg:#dff3e4;--bad-bg:#f4dddb;--warn-bg:#fff1cc;
--disp:'Playfair Display',Georgia,serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
--ease:cubic-bezier(.23,1,.32,1);--spring:cubic-bezier(.34,1.56,.64,1);
--sh1:0 1px 2px rgba(40,30,10,.05),0 8px 24px rgba(40,30,10,.06);--sh2:0 2px 4px rgba(40,30,10,.06),0 14px 32px rgba(40,30,10,.12);--sh3:0 24px 60px rgba(20,14,4,.28);
--lado:264px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:72px;color-scheme:light;touch-action:manipulation}
img{display:block;max-width:100%}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);font:0.9375rem/1.55 var(--body);-webkit-font-smoothing:antialiased;background:radial-gradient(1100px 480px at 88% -8%,rgba(201,162,75,.14),transparent 62%) fixed,var(--bg);padding-bottom:calc(88px + env(safe-area-inset-bottom,0px));min-height:100vh;min-height:100dvh}
/* Foco visible y de alto contraste en TODO lo que se puede usar con teclado */
:focus{outline:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
.side :focus-visible,.mtop :focus-visible,.sin-sesion :focus-visible{outline-color:#f1d78e}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .14s var(--ease),opacity .2s,background-color .2s,border-color .2s,box-shadow .25s var(--ease),color .2s}
a,select{touch-action:manipulation}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:var(--gold);padding:10px 16px;border-radius:99px;z-index:90;text-decoration:none;font-weight:600}.skip:focus{top:8px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mark{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font:600 1rem var(--disp);color:var(--gold);flex:none;letter-spacing:.02em;background:rgba(201,162,75,.08)}
/* Barra de progreso global: se ve mientras se espera al servidor */
.progreso{position:fixed;left:0;right:0;top:0;height:3px;z-index:100;overflow:hidden;opacity:0;transition:opacity .25s;pointer-events:none}
.progreso::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--gold),var(--gold-2),var(--gold));animation:late 1s ease-in-out infinite}
body.ocupado .progreso{opacity:1}
@keyframes late{0%,100%{opacity:.35}50%{opacity:1}}
.sinred{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:95;background:var(--ink);color:#fff;border:1px solid #3a3426;border-radius:99px;padding:9px 18px;font-size:0.8125rem;font-weight:500;display:flex;gap:8px;align-items:center;box-shadow:var(--sh2);transition:transform .35s var(--ease)}
.sinred{opacity:0;pointer-events:none}.sinred.on{transform:translate(-50%,0);opacity:1}
.sinred::before{content:"";width:8px;height:8px;border-radius:50%;background:#e5a13a}

/* ——— Disposición general ——— */
.shell{display:block}
.side{display:none}
.cont{min-width:0}
main{padding:18px max(14px,env(safe-area-inset-left,0px)) 24px max(14px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto;outline:none}
.mtop{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#151311,#0e0d0b);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));box-shadow:0 2px 12px rgba(0,0,0,.25)}
.mtop .mark{width:36px;height:36px;font-size:0.875rem}
.mtop .tt{min-width:0;flex:1}.mtop .tt b{display:block;font:600 1rem/1.15 var(--disp)}.mtop .tt small{display:block;color:#c9c1af;font-size:0.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icono{width:44px;height:44px;border-radius:50%;border:1px solid #4a4333;background:transparent;color:#fff;display:grid;place-items:center}
.icono:active{transform:scale(.92)}
.icono.girando .ic{animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
/* Barra inferior (celular) */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.bar button{flex:1;min-width:0;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;min-height:54px;font-size:0.6875rem;font-weight:500;border-radius:14px;position:relative}
.bar button .ic{width:23px;height:23px;transition:transform .25s var(--spring)}
.bar button.on{color:var(--gold-d);font-weight:700}
.bar button.on .ic{transform:translateY(-2px) scale(1.08)}
.bar button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.bar button:active{background:#f3eee1}
.bar .n,.side .n{background:var(--bad);color:#fff;border-radius:99px;font-size:0.6875rem;font-weight:600;padding:1px 7px;min-width:20px;text-align:center}
.bar .n{position:absolute;top:2px;left:calc(50% + 6px);padding:0 5px;min-width:18px;font-size:0.625rem;animation:pop .4s var(--spring)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.mas{display:grid;gap:8px;margin-top:10px}
.mas button{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;min-height:60px}
.mas button .ic{width:24px;height:24px;color:var(--gold-d)}
.mas button b{display:block;font-weight:600}.mas button small{color:var(--mut);font-size:0.8125rem}
.mas button.on{border-color:var(--gold);background:#fbf5e3}
/* Menú lateral (escritorio) */
@media(min-width:1024px){
  body{padding-bottom:0}
  .shell{display:grid;grid-template-columns:var(--lado) minmax(0,1fr);min-height:100vh;min-height:100dvh}
  .side{align-self:start;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;background:linear-gradient(180deg,#151311,#0d0c0a);color:#fff;padding:26px 16px 18px;overflow-y:auto;border-right:1px solid #26221a}
  .mtop,.bar{display:none}
  main{padding:34px 40px 56px}
  .brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px;border-bottom:1px solid #26221a;margin-bottom:14px}
  .brand .mark{width:46px;height:46px;font-size:1.0625rem}
  .brand b{display:block;font:600 1.25rem/1.1 var(--disp);letter-spacing:.01em}
  .brand small{display:block;color:#c9c1af;font-size:0.75rem;margin-top:3px}
  .side nav{flex:1}
  .grp{margin:12px 8px 4px;font-size:0.6875rem;letter-spacing:.14em;text-transform:uppercase;color:#b3ab98;font-weight:600}
  .side nav button{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;color:#d9d1bf;padding:0 12px;min-height:40px;border-radius:12px;font-weight:500;text-align:left;position:relative}
  .side nav button .n{margin-left:auto}
  .side nav button:hover{background:rgba(255,255,255,.07);color:#fff}
  .side nav button:hover .ic{transform:translateX(2px)}
  .side nav button .ic{transition:transform .25s var(--ease)}
  .side nav button.on{background:rgba(201,162,75,.16);color:#f6dd9b}
  .side .user{margin-top:14px;padding:14px 8px 0;border-top:1px solid #26221a}
  .user .who{display:flex;align-items:center;gap:12px}
  .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#e6c473,#b8923a);color:#1a1405;font:600 1.0625rem var(--disp);flex:none}
  .user .tt{min-width:0}.user .tt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user .tt small{display:block;color:#c9c1af;font-size:0.75rem}
  .user .ub{display:flex;gap:8px;margin-top:12px}
  .user .ub button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:1px solid #4a4333;background:transparent;color:#efe6d0;border-radius:12px;font-size:0.8125rem;font-weight:500}
  .user .ub button:hover{border-color:var(--gold);color:#fff}
  .user .ub button.girando .ic{animation:gira .8s linear infinite}
}
.sin-sesion{background:radial-gradient(900px 520px at 50% -10%,rgba(201,162,75,.30),transparent 60%) no-repeat,#0f0e0c;min-height:100vh;min-height:100dvh}
.sin-sesion .side,.sin-sesion .mtop,.sin-sesion .bar{display:none}
.sin-sesion .shell{display:block}
.sin-sesion main{max-width:460px;padding-top:max(44px,env(safe-area-inset-top,0px))}

/* Ventanas bajitas (portátiles con la barra de herramientas, ventanas partidas): el menú se compacta para que quepa sin cortarse */
@media(min-width:1024px) and (max-height:680px){
  .side{padding:14px 12px 10px}
  .brand{padding-bottom:12px;margin-bottom:4px}
  .brand .mark{width:38px;height:38px;font-size:15px}
  .brand small{display:none}
  .grp{margin:10px 8px 4px}
  .side nav button{min-height:38px}
  .side .user{margin-top:8px;padding-top:10px}
  .user .ub{margin-top:8px}
  .user .ub button{min-height:36px}
}
/* ——— Tipografía y encabezados de página ——— */
h2{font:600 1.625rem/1.15 var(--disp);margin:0 0 12px;letter-spacing:-.005em}
h3{font:600 1.125rem/1.2 var(--disp);margin:0 0 8px}
#app>h2:first-child{font-size:clamp(1.625rem,3.2vw,2.125rem);margin-bottom:6px}
#app>h2:first-child::after{content:"";display:block;width:38px;height:3px;border-radius:3px;background:var(--gold);margin-top:10px}
.sub{margin:10px 0 18px;color:var(--mut);max-width:62ch}
.mut{color:var(--mut);font-size:0.8125rem}
.big{font:600 1.1875rem var(--disp)}
.big,td.r,th.r,.rcard b,.kpi b,.stock{font-variant-numeric:lining-nums tabular-nums}
a{color:var(--gold-d);text-underline-offset:3px}
p{margin:0 0 10px}

/* ——— Botones ——— */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:linear-gradient(180deg,#26221a,#111);color:#f1d78e;border-radius:99px;padding:9px 20px;font-weight:600;min-height:44px;text-decoration:none;position:relative;line-height:1.2}
.btn .ic{width:18px;height:18px}
.btn:active:not(:disabled){transform:scale(.96)}
.btn.s{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.ok{background:linear-gradient(180deg,#2d6c3e,var(--ok));border-color:var(--ok);color:#fff}
.btn.bad{background:linear-gradient(180deg,#913226,var(--bad));border-color:var(--bad);color:#fff}
.btn.mini{padding:6px 14px;min-height:40px;font-size:0.8125rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* Mientras se envía un formulario, el botón muestra un indicador de carga */
button[type=submit]:disabled::before,.btn.cargando::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:gira .7s linear infinite;flex:none}
@media(hover:hover) and (pointer:fine){
  .btn:not(:disabled):hover{box-shadow:0 8px 20px rgba(17,17,17,.22);transform:translateY(-1px)}
  .btn.s:not(:disabled):hover{border-color:var(--gold);box-shadow:none;background:#fbf8ef}
  .btn.ok:not(:disabled):hover{box-shadow:0 8px 20px rgba(36,88,50,.35)}
  .btn.bad:not(:disabled):hover{box-shadow:0 8px 20px rgba(143,47,37,.35)}
  .chip:hover{border-color:var(--gold)}.icono:hover{border-color:var(--gold)}
}

/* ——— Tarjetas y listas ——— */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh1)}
.card>h3:first-child{margin-bottom:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:0 16px;min-height:40px;font-weight:500;font-size:0.875rem;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:#f1d78e;border-color:var(--ink)}
.chip:active{transform:scale(.95)}
@media(pointer:coarse){.chip,.btn.mini{min-height:44px}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .g{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 11px;font-size:0.75rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-POR_APROBAR,.pill.w{background:var(--warn-bg);color:var(--warn)}.p-APROBADO,.pill.o{background:var(--ok-bg);color:var(--ok)}.p-RECHAZADO,.p-ANULADO,.pill.m{background:var(--bad-bg);color:var(--bad)}
.pill.n{background:#ece7da;color:var(--mut)}
.pedido{cursor:pointer;position:relative;transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .2s}
.pedido:active{transform:scale(.992);background:#fbf8f0}
@media(hover:hover) and (pointer:fine){.pedido:hover{border-color:#d9bf7c;box-shadow:var(--sh2);transform:translateY(-2px)}}
.nuevo{animation:resalta 1.8s var(--ease)}
@keyframes resalta{0%{box-shadow:0 0 0 0 rgba(201,162,75,.9)}60%{box-shadow:0 0 0 10px rgba(201,162,75,0)}100%{box-shadow:var(--sh1)}}
/* Tarjeta de pedido y de producto */
.ped{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px;content-visibility:auto;contain-intrinsic-size:auto 120px}
.av2{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#f6ecd0,#e8d49a);color:#5d4510;font:600 1rem var(--disp);flex:none}
.ped.st-APROBADO .av2{background:linear-gradient(135deg,#e6f4ea,#bfe0c8);color:#1f5230}
.ped.st-RECHAZADO .av2,.ped.st-ANULADO .av2{background:linear-gradient(135deg,#f8e6e3,#ecc3bd);color:#7d2a21}
.ped .t{min-width:0}.ped .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ped .t .id{color:var(--mut);font-weight:500;font-size:0.78125rem;margin-left:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--mut);font-size:0.8125rem;margin-top:4px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta .ic{width:14px;height:14px}
.ped .d{text-align:right}.ped .d .pill{margin-top:6px}
@media(max-width:520px){.ped{grid-template-columns:auto minmax(0,1fr);row-gap:10px}.ped .d{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;text-align:left;border-top:1px solid var(--line);padding-top:10px}.ped .d .pill{margin:0}}
.precios{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.pr{display:inline-flex;flex-direction:column;background:#faf6ea;border:1px solid #efe6cd;border-radius:10px;padding:4px 9px;font-size:0.78125rem;line-height:1.25}
.pr i{font-style:normal;color:var(--mut);font-size:0.65625rem;text-transform:uppercase;letter-spacing:.04em}
.pr b{font-weight:600;font-variant-numeric:tabular-nums}
.pr.falta{background:#fbeceb;border-color:#f1cfca}.pr.falta b{color:var(--bad)}
.stock{font:600 1.375rem var(--disp)}.stock small{font:500 0.75rem var(--body);color:var(--mut);margin-left:3px}
.ped .d .pp{display:flex;flex-direction:column;align-items:flex-end;gap:5px;margin-top:6px}.ped .d .pp .pill{margin-top:0}
@media(max-width:520px){.ped .d .pp{flex-direction:row;flex-wrap:wrap;margin:0;justify-content:flex-end}}
/* Resumen de cifras */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:6px 0 20px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--sh1);position:relative;overflow:hidden}
.kpi .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--gold-l);color:var(--gold-d);margin-bottom:10px}
.kpi small{display:block;color:var(--mut);font-size:0.78125rem;font-weight:500}
.kpi b{display:block;font:600 clamp(1.25rem,2.4vw,1.625rem)/1.15 var(--disp);margin:2px 0}
.kpi i{font-style:normal;color:var(--mut);font-size:0.78125rem}
.kpi.alerta{border-color:#e6cf8f;background:linear-gradient(180deg,#fffaf0,#fff)}
.kpi.alerta::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--gold),#e8cf8f)}
@media(max-width:520px){.kpis{gap:10px}.kpi{padding:12px 14px}.kpi .ico{display:none}.kpi small{font-size:0.75rem}.kpi i{font-size:0.75rem;line-height:1.3;display:block}}
/* Estados vacío y de carga */
.vacio{text-align:center;padding:44px 16px;color:var(--mut)}
.vacio .circ{width:68px;height:68px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:var(--gold-l);color:var(--gold-d)}
.vacio .circ .ic{width:30px;height:30px}
.vacio b{display:block;font:600 1.25rem var(--disp);color:var(--ink);margin-bottom:4px}
.empty{text-align:center;color:var(--mut);padding:36px 0}
.skl{display:grid;gap:12px}
.skl i{display:block;height:84px;border-radius:18px;background:linear-gradient(90deg,#efe8d7 25%,#f8f4ea 50%,#efe8d7 75%);background-size:200% 100%;animation:brilla 1.4s linear infinite}
.skl i:first-child{height:120px}
@keyframes brilla{to{background-position:-200% 0}}

/* ——— Formularios ——— */
.fld{display:grid;gap:14px;margin-top:10px}
.fld label{display:grid;gap:6px;font-size:0.8125rem;color:var(--mut);font-weight:600}
input,select,textarea{border:1.5px solid var(--line2);border-radius:14px;padding:10px 14px;background:#fff;color:var(--ink);width:100%;min-height:48px;font-size:1rem;scroll-margin-block:90px;transition:border-color .2s,box-shadow .25s var(--ease),background-color .2s}

try{var g=JSON.parse(localStorage.getItem('ds_panel')||'null');if(g){S.token=g.token;S.usuario=g.usuario;S.rol=g.rol}}catch(e){}

/* ——— Registro de fallas: los errores de pantalla y de conexión se anotan en la hoja «Errores» del servidor (evidencia para soporte) ——— */
var FALLAS={cola:[],enviando:false};

  mensaje=String(mensaje||'').slice(0,200);if(!mensaje)return;

  FALLAS.cola.push({t:Date.now(),a:String(accion||'').slice(0,60),m:mensaje,d:String(detalle||'').slice(0,400)});FALLAS.cola=FALLAS.cola.slice(-10);guardarFallas();

function enviarFallas(){
  if(FALLAS.enviando||!FALLAS.cola.length||navigator.onLine===false)return;

function titulo(n){
  var t=String(n==null?'':n).replace(/\s+/g,' ').trim();
  if(!/[A-ZÀ-Þ]/.test(t)||t!==t.toUpperCase())return t;
  var MIN={DE:1,DEL:1,LA:1,LAS:1,EL:1,LOS:1,Y:1,E:1,O:1,CON:1,SIN:1,PARA:1,POR:1,EN:1,A:1,AL:1,UN:1,UNA:1},SIG={SPF:1,BB:1,CC:1,HD:1,UV:1,LED:1,PH:1,SOS:1,DD:1,AHA:1,BHA:1,PDRN:1,USB:1},UN={ML:'ml',G:'g',GR:'g',KG:'kg',MG:'mg',OZ:'oz',CM:'cm',MM:'mm',L:'L'};
  var primero=true,antesNum=false;
  return t.split(/(\s+|[-\/(),])/).map(function(tk){
    if(!/[A-Za-zÀ-ÿ0-9]/.test(tk))return tk;
    var up=tk.toUpperCase(),m=/^(\d+(?:[.,]\d+)?)(ML|G|GR|KG|MG|OZ|CM|MM|L)$/.exec(up),r;
    if(m)r=m[1]+UN[m[2]];
    else if(antesNum&&/^(ML|G|GR|KG|MG|OZ|CM|MM)$/.test(up))r=up==='GR'?'g':up.toLowerCase();
    else if(SIG[up])r=up;
    else if(MIN[up]&&!primero)r=tk.toLowerCase();
    else r=tk.toLowerCase().replace(/(^|['’])([a-zà-ÿ])/g,function(x,pp,ch){return pp+ch.toUpperCase()});
    primero=false;antesNum=/^\d+(?:[.,]\d+)?$/.test(up);
    return r;
  }).join('');
}

    +'<div class="row" style="margin-top:8px"><select id="eAdd" style="flex:1"><option value="">Agregar un producto…</option></select><button class="btn s mini" id="eAddB" type="button">Agregar</button></div>'
    +'<p class="mut">Pon 0 para quitar. Los productos nuevos usan el precio actual de la lista '+esc(p.lista)+'.</p>'
    +'<div class="fld"><label>Motivo del cambio<input id="eMot" maxlength="200" placeholder="Ej. El cliente pidió 5 más"></label></div><div id="eRes">'+(res||'')+'</div>'

  $('#cerr').onclick=function(){detallePedido(id)};
  var leer=function(){document.querySelectorAll('#sheet .qe').forEach(function(e){it[Number(e.dataset.i)].cantidad=aNumero(e.value)||0})};
  var motivo=function(){return ($('#eMot').value||'').trim()};
  api('listarProductos',{}).then(function(r){
    if(!r||!r.ok)return;var ya={};it.forEach(function(l){ya[l.codigo]=1});var sel=$('#eAdd');if(!sel)return;
    r.productos.filter(function(x){return x.activo&&!ya[x.codigo]&&x.precios&&x.precios[p.lista]>0}).forEach(function(x){
      var o=document.createElement('option');o.value=x.codigo;o.textContent=x.codigo+' · '+x.nombre+(x.tono_presentacion?' ('+x.tono_presentacion+')':'');o.dataset.n=x.nombre+(x.tono_presentacion?' ('+x.tono_presentacion+')':'');o.dataset.uv=x.unidad_venta;o.dataset.pc=x.unidades_por_caja;sel.appendChild(o)});
  });
  $('#eAddB').onclick=function(){
    var sel=$('#eAdd'),o=sel.options[sel.selectedIndex];if(!o||!o.value)return;
    leer();it.push({codigo:o.value,nombre:o.dataset.n,cantidad:1,uv:o.dataset.uv,pc:Number(o.dataset.pc)||1});editorPedido(id,it,'');
  };
  var llamar=function(modo,forzar){
    leer();var mot=motivo();
    if(modo==='aplicar'&&!mot){marcar($('#eMot'));toast('Escribe el motivo');return}
    var btns=document.querySelectorAll('#sheet .btn');btns.forEach(function(b){b.disabled=true});
    api('editarPedido',{id:id,items:it.map(function(l){return {codigo:l.codigo,cantidad:l.cantidad}}),modo:modo,motivo:mot,forzar:!!forzar},modo==='aplicar'?nuevaLlave():undefined).then(function(r){

      if(r&&r.ok&&r.aplicado){toast(r.message);return cargarPedidos().then(function(){pintarTabs();vistaPedidos();detallePedido(id)})}
      if(r&&r.ok&&r.sinCambios){$('#eRes').innerHTML='<div class="warn">No hay cambios que guardar.</div>';return}
      if(r&&r.ok&&r.validado){

          +'<div class="row" style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px"><span class="g">Total</span><b>'+cop(r.totalAntes)+' → '+cop(r.totalDespues)+'</b></div>'
          +'<div class="mut" style="margin-top:6px">'+(r.afectaStock?'El stock se ajusta solo por la diferencia.':(p.estado==='APROBADO'?'Este pedido se aprobó antes de la última carga de Factusol: no mueve el stock.':'El stock no se mueve hasta aprobarlo.'))+'</div></div>'
          +(r.avisos&&r.avisos.length?'<div class="warn">Se guardará con: '+esc(r.avisos.join(', '))+'.</div>':'');
        $('#eGuardar').disabled=false;$('#eGuardar').onclick=function(){llamar('aplicar',!!forzar)};return}
      var msg='<div class="err">'+esc((r&&r.message)||'No se pudo revisar')+'</div>';
      if(r&&r.faltantes)msg+='<div class="warn">'+r.faltantes.map(function(f){return esc(f.nombre)+': pide '+f.pide+', hay '+f.hay}).join('<br>')+'<br>Solo continúa si ya lo confirmaste con bodega.</div><button class="btn bad" id="eForz" type="button" style="margin-top:8px">Continuar de todos modos</button>';
      else if(r&&r.minimo)msg+='<button class="btn bad" id="eForz" type="button" style="margin-top:8px">Dejarlo por debajo del mínimo</button>';
      $('#eRes').innerHTML=msg;var f=$('#eForz');if(f)f.onclick=function(){llamar('validar',true)};
    }).catch(function(){btns.forEach(function(b){b.disabled=false});toast('No pudimos conectar')});
  };
  $('#eVer').onclick=function(){llamar('validar',false)};
}

    +'<div><small>Asesor</small><b>'+esc(nombreVend(p.vendedor))+'</b><div>Lista '+esc(p.lista)+'</div></div>'

    +(p.observaciones?'<div class="im-obs"><small>Observaciones</small>'+esc(p.observaciones)+'</div>':'')

  if(puede){

      h+='<div class="acciones"><div class="fld" style="flex:1 1 100%;margin:0"><label>Motivo (solo para rechazar)<input id="dMot" maxlength="200" placeholder="Ej. Cliente cambió de idea"></label></div><button class="btn ok" id="aprob" type="button">'+iconoSvg('i-check')+(extra&&extra.faltantes?'Aprobar de todos modos':'Aprobar')+'</button><button class="btn bad" id="rech" type="button">Rechazar</button><button class="btn s" id="editar" type="button">'+iconoSvg('i-edit')+'Editar</button></div>';

/* Costos desde Excel (código y costo) */
function importarCostos(){
  var D=null;
  modal('<div class="row"><h2 class="g" style="margin:0">Cargar costos</h2><button class="btn s mini" id="cerrX" type="button">Cerrar</button></div><p class="mut">Sube un Excel con una columna de código y otra de costo. Primero se valida todo; si hay un error, no se guarda nada. Después, las listas por margen se recalculan solas.</p>'
    +'<label class="fld"><span class="mut">Archivo Excel (.xlsx, .xls) o CSV</span><input type="file" id="cArch" accept=".xlsx,.xls,.csv"></label><div id="cBody"></div>');
  $('#cArch').onchange=function(){
    var f=this.files[0];if(!f)return;$('#cBody').innerHTML='<p class="mut">Leyendo…</p>';
    cargarXlsx().then(function(){return f.arrayBuffer()}).then(function(buf){
      var wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],filas=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      var head=0;for(var i=0;i<Math.min(filas.length,10);i++){if(filas[i].filter(function(x){return String(x).trim()}).length>=2){head=i;break}}
      D={cab:filas[head].map(String),datos:filas.slice(head+1).map(function(r,i){return {r:r,n:head+i+2}}).filter(function(x){return x.r.some(function(c){return String(c).trim()})})};
      var ic=-1,ik=-1;D.cab.forEach(function(h,i){if(ic<0&&/c[oó]d|ref|sku/i.test(h))ic=i;else if(ik<0&&/costo|cost/i.test(h))ik=i});
      var op=function(v){return '<option value="-1">— Elige —</option>'+D.cab.map(function(c,i){return '<option value="'+i+'"'+(i===v?' selected':'')+'>'+esc(c||('Columna '+(i+1)))+'</option>'}).join('')};
      $('#cBody').innerHTML='<p class="mut">'+D.datos.length+' filas con datos.</p><div class="two"><label>Columna del código<select id="cC">'+op(ic)+'</select></label><label>Columna del costo<select id="cK">'+op(ik)+'</select></label></div><div id="cRes"></div>'
        +'<div class="acciones"><button class="btn" id="cVer" type="button">Validar</button><button class="btn ok" id="cAp" type="button" hidden>Guardar costos</button></div>';
      var filasC=function(){var a=Number($('#cC').value),b=Number($('#cK').value);return D.datos.map(function(x){return {_fila:x.n,codigo:String(x.r[a]==null?'':x.r[a]).trim(),costo:x.r[b]}})};
      var llamar=function(modo,btn){
        if(Number($('#cC').value)<0||Number($('#cK').value)<0){$('#cRes').innerHTML='<div class="err">Elige las dos columnas.</div>';return}
        btn.disabled=true;
        api('guardarCostos',{filas:filasC(),modo:modo},modo==='aplicar'?nuevaLlave():undefined).then(function(r){
          btn.disabled=false;
          if(!r||!r.ok){$('#cRes').innerHTML='<div class="err">'+esc((r&&r.message)||'No se pudo')+(r&&r.errores?'<br>'+r.errores.slice(0,8).map(function(x){return 'Fila '+x.fila+' ('+esc(x.codigo)+'): '+esc(x.message)}).join('<br>'):'')+'</div>';return}
          if(modo==='validar'){$('#cRes').innerHTML='<div class="ok2" role="status">'+esc(r.message)+'</div>';$('#cAp').hidden=false;return}
          S.productos=null;cerrar();toast(r.message);SON.ok();if(S.tab==='precios')vistaPrecios();
        }).catch(function(){btn.disabled=false;$('#cRes').innerHTML='<div class="err">No pudimos conectar.</div>'});
      };
      $('#cVer').onclick=function(){$('#cAp').hidden=true;llamar('validar',this)};
      $('#cAp').onclick=function(){llamar('aplicar',this)};
    }).catch(function(e){$('#cBody').innerHTML='<div class="err">'+esc(e.message||'No se pudo leer el archivo')+'</div>'});
  };
}

var XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function cargarXlsx(){return new Promise(function(ok,no){if(window.XLSX)return ok();var s=document.createElement('script');s.src=XLSX_URL;s.onload=ok;s.onerror=function(){no(new Error('No se pudo cargar el lector de Excel'))};document.head.appendChild(s)})}
var FILAS=null,MODO_STOCK='semanal';
/* Números como se escriben en Colombia: «1.200» son mil doscientos y «12,5» es doce y medio (un texto así no debe leerse como 1,2). */
function aNumero(v){
  if(typeof v==='number')return isFinite(v)?v:0;
  var s=String(v==null?'':v).trim().replace(/\s/g,'');
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d+,\d+$/.test(s))s=s.replace(',','.');
  else s=s.replace(/[^0-9.\-]/g,'');
  var n=Number(s);return isFinite(n)?n:0;
}

    };

function mapaColumnas(){
  var cab=FILAS.cab,ic=0,iu=1;

  var op=function(sel){return cab.map(function(c,i){return '<option value="'+i+'"'+(i===sel?' selected':'')+'>'+esc(c||('Columna '+(i+1)))+'</option>'}).join('')};

  };
  $('#cC').onchange=prev;$('#cU').onchange=prev;prev();
  $('#stGo').onclick=function(){
    if(restock)return revisarRestock();
    preguntar('Esto REEMPLAZA todo el stock actual con las '+FILAS.salida.length+' filas del archivo y reinicia el descuento de los pedidos aprobados. ¿Continuar?',function(){enviarSemanal()});
  };

function problemasProd(p){
  var pr=[];
  if(!p.activo)return pr;
  if([1,2,3,4,5].some(function(l){return !p.precios[l]}))pr.push('precio');
  if(p.stock===null||p.stock<=0)pr.push('stock');
  return pr;
}

function pintarProductos(){
  var f=S.fprod||'todos',q=(S.qprod||'').toLowerCase(),cnt={precio:0,stock:0,inactivos:0};
  S.productos.forEach(function(p){problemasProd(p).forEach(function(x){cnt[x]++});if(!p.activo)cnt.inactivos++});
  var lista=S.productos.filter(function(p){
    if(q&&sinT(p.codigo+' '+p.nombre+' '+p.tono_presentacion+' '+p.marca+' '+titulo(p.nombre)).indexOf(sinT(q))<0)return false;
    if(f==='todos')return true;if(f==='inactivos')return !p.activo;return problemasProd(p).indexOf(f)>=0;
  });
  var chips=[['todos','Todos ('+S.productos.length+')'],['precio','Sin precio ('+cnt.precio+')'],['stock','Sin stock ('+cnt.stock+')'],['inactivos','Apagados ('+cnt.inactivos+')']];
  var h='<div class="row"><h2 class="g">Productos y precios</h2>'+(S.puedeTodo?'<button class="btn s mini" id="impP">Importar Excel</button><button class="btn mini" id="nuevoP">Nuevo producto</button>':'')+'</div>'
    +'<div class="chips">'+chips.map(function(c){return '<button class="chip'+(f===c[0]?' on':'')+'" data-f="'+c[0]+'">'+esc(c[1])+'</button>'}).join('')+'</div>'
    +'<input id="qP" type="search" enterkeyhint="search" autocomplete="off" aria-label="Buscar producto" placeholder="Buscar por código, nombre o marca  ( / )" value="'+esc(S.qprod||'')+'" style="margin-bottom:12px">';

function mapaImp(){

/* ——— Reportes ——— */
var REP={preset:'mes',desde:'',hasta:'',datos:null,cli:'valor',prod:'valor',comp:false,prev:null};
function fTxt(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function rangoRep(p){
  var h=new Date(),y=h.getFullYear(),m=h.getMonth();
  if(p==='pasado')return [fTxt(new Date(y,m-1,1)),fTxt(new Date(y,m,0))];
  if(p==='30')return [fTxt(new Date(h.getTime()-29*864e5)),fTxt(h)];
  if(p==='anio')return [fTxt(new Date(y,0,1)),fTxt(h)];
  if(p==='otro')return [REP.desde,REP.hasta];
  return [fTxt(new Date(y,m,1)),fTxt(h)];
}
function rangoPrevio(desde,hasta){
  var a=new Date(desde+'T12:00:00'),b=new Date(hasta+'T12:00:00'),n=Math.round((b-a)/864e5)+1;
  var fin=new Date(a.getTime()-864e5),ini=new Date(fin.getTime()-(n-1)*864e5);
  return [fTxt(ini),fTxt(fin)];
}
function delta(act,ant){
  if(!ant&&!act)return '<span class="dl eq">sin cambio</span>';
  if(!ant)return '<span class="dl up">nuevo</span>';
  var p=Math.round((act-ant)/ant*100);
  if(p===0)return '<span class="dl eq">igual</span>';
  return '<span class="dl '+(p>0?'up':'dn')+'">'+(p>0?'▲ ':'▼ ')+Math.abs(p)+' %</span>';
}
function vistaReportes(){
  var r=rangoRep(REP.preset);REP.desde=r[0];REP.hasta=r[1];
  $('#app').innerHTML='<h2>Reportes</h2><div class="empty">Calculando…</div>';
  api('reportes',{desde:REP.desde,hasta:REP.hasta}).then(function(x){
    if(!x||!x.ok){$('#app').innerHTML='<h2>Reportes</h2><div class="err">'+esc((x&&x.message)||'No se pudo calcular el reporte.')+'</div>'+barraPeriodo();ligarPeriodo();return}
    REP.datos=x;REP.prev=null;
    if(!REP.comp)return pintarReporte();
    var pr=rangoPrevio(REP.desde,REP.hasta);
    return api('reportes',{desde:pr[0],hasta:pr[1]}).then(function(y){REP.prev=(y&&y.ok)?y:null;pintarReporte()});
  }).catch(function(){$('#app').innerHTML='<div class="err">No pudimos conectar.</div>'});
}
function barraPeriodo(){
  var ps=[['mes','Este mes'],['pasado','Mes pasado'],['30','Últimos 30 días'],['anio','Este año'],['otro','Otro período']];
  return '<div class="chips">'+ps.map(function(p){return '<button class="chip'+(REP.preset===p[0]?' on':'')+'" data-p="'+p[0]+'">'+p[1]+'</button>'}).join('')+'<button class="chip'+(REP.comp?' on':'')+'" id="rComp" type="button" aria-pressed="'+REP.comp+'">Comparar con el período anterior</button></div>'
    +(REP.preset==='otro'?'<div class="fechas"><label>Desde<input type="date" id="rDes" value="'+esc(REP.desde)+'"></label><label>Hasta<input type="date" id="rHas" value="'+esc(REP.hasta)+'"></label><button class="btn mini" id="rVer">Ver</button></div>':'');
}
function ligarPeriodo(){
  $('#app').onclick=function(e){
    var c=e.target.closest('.chip');
    if(c&&c.dataset.p){REP.preset=c.dataset.p;if(REP.preset==='otro'){pintarReporte(true)}else vistaReportes();return}
    if(c&&c.dataset.cl){REP.cli=c.dataset.cl;pintarReporte();return}
    if(c&&c.dataset.pr){REP.prod=c.dataset.pr;pintarReporte();return}
    var b=e.target.closest('button');if(!b)return;
    if(b.id==='rComp'){REP.comp=!REP.comp;if(REP.preset==='otro'&&!REP.datos)pintarReporte(true);else vistaReportes();return}
    if(b.id==='rExcel'){exportarExcel(b);return}
    if(b.id==='rVer'){REP.desde=$('#rDes').value;REP.hasta=$('#rHas').value;vistaReportes()}
    if(b.id==='rCopiar')copiar(resumenRep());

    var nombre='reporte-distrisander-'+d.desde+'-a-'+d.hasta+'.xlsx';

  }).catch(function(e){toast((e&&e.message)||'No se pudo crear el Excel')}).then(function(){btn.disabled=false;btn.innerHTML=t0});
}
function resumenRep(){
  var d=REP.datos,r=d.resumen,t='*REPORTE DISTRISANDER* '+d.desde+' al '+d.hasta+'\nVentas aprobadas: '+cop(r.ventas)+' ('+r.pedidos+' pedidos, ticket '+cop(r.ticket)+')\nClientes que compraron: '+r.clientes+'\nPor aprobar: '+r.estados.POR_APROBAR.n+' ('+cop(r.estados.POR_APROBAR.total)+')\n\n*Por vendedor*\n';
  d.vendedores.filter(function(v){return v.ventas>0}).forEach(function(v){t+='• '+v.nombre+': '+cop(v.ventas)+' ('+v.pedidos+' pedidos)\n'});
  t+='\n*Por marca*\n';d.marcas.forEach(function(m){t+='• '+m.marca+': '+cop(m.ventas)+'\n'});
  t+='\n*Más vendidos*\n';d.productos.slice(0,5).forEach(function(p){t+='• '+p.nombre+(p.tono?' ('+p.tono+')':'')+': '+cop(p.ventas)+'\n'});

function notificar(titulo,cuerpo,tag,alTocar){
  if(!avisosActivos())return;
  try{var n=new Notification(titulo,{body:cuerpo,tag:tag||'ds',icon:'icons/panel-apple-touch-icon.png'});n.onclick=function(){try{window.focus()}catch(e){}try{n.close()}catch(e){}if(alTocar)alTocar()}}catch(e){}
}
function pedirAvisos(){
  if(!avisosDisponibles()){toast('Este navegador no permite avisos del sistema');return Promise.resolve(false)}
  return Promise.resolve(Notification.requestPermission()).then(function(r){
    PREF.avisos=(r==='granted');guardarPref();
    if(r==='granted')notificar('Avisos activados','Te avisaremos cuando llegue un pedido nuevo.','ds-prueba');
    else toast(r==='denied'?'El navegador bloqueó los avisos. Se activan desde el candado de la barra de direcciones.':'No se activaron los avisos');
    return r==='granted';
  });
}
/* Sonidos suaves (se activan con el primer toque; se pueden silenciar en Ajustes o con Ctrl+K) */
var SON=(function(){
  var ctx=null;
  function notas(l,vol){
    if(!PREF.sonido)return;
    try{
      ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();
      var t0=ctx.currentTime;
      l.forEach(function(n){var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=n[0];
        g.gain.setValueAtTime(.0001,t0+n[1]);g.gain.exponentialRampToValueAtTime(vol||.07,t0+n[1]+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+n[1]+n[2]);
        o.connect(g);g.connect(ctx.destination);o.start(t0+n[1]);o.stop(t0+n[1]+n[2]+.02)});
    }catch(e){}
  }
  return {nuevo:function(){notas([[659,0,.12],[880,.11,.12],[1175,.22,.24]])},ok:function(){notas([[784,0,.08],[1175,.07,.14]],.05)},error:function(){notas([[240,0,.16]],.06)},prueba:function(){notas([[988,0,.1],[1319,.09,.14]])}};
})();
/* Actualización automática: cada 45 s y al volver a la pestaña. Avisa cuando llega un pedido nuevo por aprobar (en cualquier sección). */
var VISTOS=null;
function pendientes(){var o={};S.pedidos.forEach(function(p){if(p.estado==='POR_APROBAR')o[p.id]=p});return o}
function refrescarPedidos(){
  if(!S.token||!$('#ov').hidden)return;
  var visible=document.visibilityState==='visible';
  if(!visible&&!avisosActivos())return;          // con la pestaña oculta solo se vigila si hay avisos del navegador activos
  var antes=VISTOS||pendientes(),firma0=firmaPedidos();
  EST.refresh=true;pintarEstado();
  cargarPedidos().then(function(){EST.refresh=false;pintarEstado();
    var ahora=pendientes(),nuevos=Object.keys(ahora).filter(function(id){return !antes[id]});
    VISTOS=ahora;if(firmaPedidos()===firma0)return;      // nada cambió: no se repinta
    pintarTabs();
    if(S.tab==='pedidos'&&$('#ov').hidden)vistaPedidos();
    if(nuevos.length){
      toast(nuevos.length===1?'Llegó un pedido nuevo: '+ahora[nuevos[0]].negocio:'Llegaron '+nuevos.length+' pedidos nuevos');SON.nuevo();
      if(!visible){var un=nuevos.length===1?ahora[nuevos[0]]:null;notificar(un?'Pedido nuevo: '+un.negocio:nuevos.length+' pedidos nuevos',un?cop(un.total)+' · '+nombreVend(un.vendedor):nuevos.map(function(id){return ahora[id].negocio}).join(', '),'ds-pedido',function(){irA('pedidos')})}
      setTimeout(function(){nuevos.forEach(function(id){var el=document.querySelector('.pedido[data-id="'+id+'"]');if(el)el.classList.add('nuevo')})},60);
    }
  }).catch(function(){EST.refresh=false;EST.error=true;pintarEstado()});
}
setInterval(refrescarPedidos,45000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')refrescarPedidos()});
/* Accesibilidad: las tarjetas que se tocan funcionan con teclado y los avisos de error se anuncian */
new MutationObserver(function(){
  document.querySelectorAll('#app .pedido:not([tabindex])').forEach(function(el){el.setAttribute('tabindex','0');el.setAttribute('role','button')});
  var h2=document.querySelector('#app>h2:first-child');
  if(h2&&S.token&&SUBS[S.tab]&&!(h2.nextElementSibling&&h2.nextElementSibling.classList.contains('sub'))&&!document.body.classList.contains('sin-sesion')){var pp=document.createElement('p');pp.className='sub';pp.textContent=SUBS[S.tab];h2.after(pp)}
  document.querySelectorAll('.err:not([role]),.warn:not([role])').forEach(function(el){el.setAttribute('role',el.classList.contains('err')?'alert':'status')});
}).observe(document.body,{childList:true,subtree:true});
$('#app').addEventListener('keydown',function(e){var el=e.target.closest&&e.target.closest('.pedido');if(el&&el===e.target&&(e.key==='Enter'||e.key===' ')){e.preventDefault();el.click()}});
if(S.token){api('miSesion',{}).then(function(r){if(r&&r.ok){S.rol=r.rol;S.usuario=r.usuario;arrancar()}else vistaLogin()}).catch(function(){vistaLogin('No pudimos conectar. Intenta de nuevo.')})}
else{api('estadoInstalacion',{}).then(function(r){if(r&&r.ok&&!r.adminConfigurado)vistaPrimera();else vistaLogin()}).catch(function(){vistaLogin()})}
})();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})</script>
