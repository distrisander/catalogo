<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="panel.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/panel-apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panel DS">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Panel Distrisander</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Panel de trabajo: más denso y práctico que el catálogo, con la misma paleta negro y dorado. */
:root{--ink:#111;--gold:#C9A24B;--gold-d:#7f5c12;--bg:#f6f3ec;--card:#fff;--line:#e6dfcf;--mut:#625b50;--ok:#2f6b3f;--bad:#a63a2e;--warn:#9a6b00;
--disp:'Playfair Display',Georgia,serif;--body:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-bottom:40px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
header{background:var(--ink);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.mark{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font:600 15px var(--disp);color:var(--gold);flex:none}
.top h1{margin:0;font:600 18px var(--disp)}
.top small{display:block;color:#b9b1a0;font-size:12px}
.top .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--gold);border-radius:99px;padding:9px 16px;font-weight:600;min-height:40px}
.btn.s{background:transparent;color:var(--ink);border-color:var(--line)}
header .btn.s{color:#fff;border-color:#3a3426}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.mini{padding:6px 12px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
nav{background:#1c1a15;overflow-x:auto;scrollbar-width:none}
nav .wrap{display:flex;gap:4px}
nav button{background:none;border:0;color:#b9b1a0;padding:12px 14px;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--gold);border-color:var(--gold)}
nav .n{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:5px}
main{padding-top:18px}
h2{font:600 22px var(--disp);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-weight:500;font-size:14px}
.chip.on{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .g{flex:1;min-width:0}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.p-POR_APROBAR{background:#fff1cc;color:var(--warn)}.p-APROBADO{background:#dff3e4;color:var(--ok)}.p-RECHAZADO,.p-ANULADO{background:#f4dddb;color:var(--bad)}
.mut{color:var(--mut);font-size:13px}
.big{font:600 18px var(--disp)}
.pedido{cursor:pointer}.pedido:hover{border-color:var(--gold)}
.fld{display:grid;gap:10px;margin-top:10px}
.fld label{display:grid;gap:4px;font-size:13px;color:var(--mut);font-weight:500}
input,select,textarea{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);width:100%;min-height:42px}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.mal{border-color:var(--bad)!important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.url{font:12px ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;word-break:break-all;margin:6px 0}
.off{opacity:.55}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
td.r,th.r{text-align:right;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(17,17,17,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:24px}}
.rcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}.rcard b{display:block;font:600 22px var(--disp)}.rcard span{color:var(--mut);font-size:13px}
.barra{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}.barra i{display:block;height:100%;background:var(--gold);border-radius:99px}
.dias{display:flex;align-items:flex-end;gap:4px;height:90px;overflow-x:auto;padding-top:6px}.dias div{flex:1 0 14px;max-width:34px;background:var(--gold);border-radius:6px 6px 0 0;min-height:3px}
.dias+.mut{display:flex;justify-content:space-between}
.pill.n{background:#ece7da;color:var(--mut)}
.fechas{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.fechas label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:99px;padding:11px 20px;font-size:14px;z-index:50;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
.toast.on{opacity:1}
.warn{background:#fff1cc;color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.err{background:#f9e3e0;color:var(--bad);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.login{max-width:420px;margin:40px auto}
.empty{text-align:center;color:var(--mut);padding:30px 0}
</style>
</head>
<body>
<header><div class="wrap top">
  <div class="mark">DS</div>
  <div><h1>Panel Distrisander</h1><small id="quien">Acceso con PIN</small></div>
  <div class="sp" id="acc" hidden><button class="btn s mini" id="btnAct">Actualizar</button><button class="btn s mini" id="btnSalir">Salir</button></div>
</div></header>
<nav id="nav" hidden><div class="wrap" id="tabs"></div></nav>
<main class="wrap" id="app"></main>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
var API='https://script.google.com/macros/s/AKfycbwo0_mg4rXAew1Sb1abzeFUD99gw8X65bDqizjIxaVYty60FjzlbSHhQMpOHHJXr2XW0w/exec';
var BASE_CAT=location.href.replace(/panel\.html.*$/,'').replace(/[^\/]*$/,'')+'index.html?k=';
var LISTAS={1:'Bucaramanga y área',2:'Sábana de Torres y pueblos',3:'Pamplona, Cúcuta y área',4:'Arauca, Tibú y zona roja',5:'Detal'};
var ROLES={administrador:'Administrador',gerente:'Gerente',vendedor:'Vendedor'};
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var cop=function(n){return '$ '+Math.round(n||0).toLocaleString('es-CO')};
var pausa=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var S={token:'',usuario:'',rol:'',tab:'pedidos',filtro:'POR_APROBAR',pedidos:[],vendedores:[],enlaces:[],ajustes:null};
try{var g=JSON.parse(localStorage.getItem('ds_panel')||'null');if(g){S.token=g.token;S.usuario=g.usuario;S.rol=g.rol}}catch(e){}

/* ——— Servidor (misma lógica que el catálogo: reintentos y llave anti-duplicado) ——— */
function api(action,data,idem){
  var intento=0,enCurso=0;
  function una(){
    intento++;
    var ctrl=window.AbortController?new AbortController():null,t=setTimeout(function(){if(ctrl)ctrl.abort()},45000);
    return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',cache:'no-store',signal:ctrl?ctrl.signal:undefined,
      body:JSON.stringify({action:action,data:data||{},idem:idem||undefined,token:S.token})})
      .then(function(r){return r.text()})
      .then(function(txt){clearTimeout(t);var j;try{j=JSON.parse(txt)}catch(e){throw new Error('respuesta')}return j})
      .then(function(j){if(j&&j.enCurso&&enCurso<8){enCurso++;intento--;return pausa(2500).then(una)}return j})
      .catch(function(e){clearTimeout(t);if(intento<3&&navigator.onLine!==false&&(!idem?isRead(action):true))return pausa(900*intento).then(una);throw e});
  }
  return una().then(function(j){if(j&&j.pinRequerido&&S.token){sesionVencida()}return j});
}
function isRead(a){return /^(listar|leer|miSesion|estado|catalogo)/.test(a)}
function nuevaLlave(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}

function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},Math.min(6000,2200+m.length*40))}
function modal(html){var o=$('#ov');$('#sheet').innerHTML=html;o.hidden=false;document.body.style.overflow='hidden'}
function cerrar(){$('#ov').hidden=true;document.body.style.overflow=''}
$('#ov').addEventListener('click',function(e){if(e.target.id==='ov')cerrar()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')cerrar()});
function copiar(txt){return (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast('Copiado')},function(){window.prompt('Copia el texto:',txt)})}
function marcar(el){if(!el)return;el.classList.add('mal');el.focus();el.addEventListener('input',function f(){el.classList.remove('mal');el.removeEventListener('input',f)})}

/* ——— Acceso ——— */
function guardarSesion(r){S.token=r.token;S.usuario=r.usuario;S.rol=r.rol;try{localStorage.setItem('ds_panel',JSON.stringify({token:r.token,usuario:r.usuario,rol:r.rol}))}catch(e){}}
function sesionVencida(){S.token='';try{localStorage.removeItem('ds_panel')}catch(e){}vistaLogin('Tu sesión venció. Entra de nuevo con tu PIN.')}
function vistaLogin(msg){
  $('#acc').hidden=true;$('#nav').hidden=true;$('#quien').textContent='Acceso con PIN';
  $('#app').innerHTML='<div class="login card"><h2>Entrar</h2>'+(msg?'<div class="warn">'+esc(msg)+'</div>':'')
    +'<form class="fld" id="fLogin"><label>Usuario<select id="lUser"><option value="juancarlos">Juan Carlos (gerente)</option><option value="kevin">Kevin (administrador)</option></select></label>'
    +'<label>PIN<input id="lPin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" placeholder="4 a 6 números"></label>'
    +'<div id="lErr"></div><button class="btn" id="lGo" type="submit">Entrar</button></form>'
    +'<p class="mut" style="margin-top:14px">¿Primera vez como administrador? <a href="#" id="primera">Crear mi PIN con la clave de instalación</a></p></div>';
  $('#fLogin').addEventListener('submit',function(e){
    e.preventDefault();var b=$('#lGo'),pin=$('#lPin').value.trim();
    if(!/^\d{4,6}$/.test(pin)){marcar($('#lPin'));return}
    b.disabled=true;b.textContent='Entrando…';
    api('verificarPin',{usuario:$('#lUser').value,pin:pin}).then(function(r){
      if(!r||!r.ok){b.disabled=false;b.textContent='Entrar';$('#lErr').innerHTML='<div class="err">'+esc((r&&r.message)||'No se pudo entrar.')+'</div>';return}
      if(r.rol==='vendedor'){b.disabled=false;b.textContent='Entrar';$('#lErr').innerHTML='<div class="err">Los vendedores entran desde su catálogo, con el botón «Soy asesor».</div>';return}
      guardarSesion(r);arrancar();
    }).catch(function(){b.disabled=false;b.textContent='Entrar';$('#lErr').innerHTML='<div class="err">No pudimos conectar. Revisa tu internet.</div>'});
  });
  $('#primera').addEventListener('click',function(e){e.preventDefault();vistaPrimera()});
}
function vistaPrimera(){
  $('#app').innerHTML='<div class="login card"><h2>Primera vez</h2><p class="mut">Solo el administrador (Kevin). La clave de instalación es la que mostró <b>INSTALAR()</b> en Apps Script; sirve una sola vez.</p>'
    +'<form class="fld" id="fPri"><label>Clave de instalación<input id="pCod" autocomplete="off" maxlength="20"></label>'
    +'<label>Tu PIN nuevo (4 a 6 números)<input id="pPin" type="password" inputmode="numeric" maxlength="6"></label>'
    +'<label>Repite el PIN<input id="pPin2" type="password" inputmode="numeric" maxlength="6"></label><div id="pErr"></div>'
    +'<button class="btn" type="submit">Crear PIN y entrar</button></form><p class="mut" style="margin-top:14px"><a href="#" id="volver">Volver</a></p></div>';
  $('#volver').addEventListener('click',function(e){e.preventDefault();vistaLogin()});
  $('#fPri').addEventListener('submit',function(e){
    e.preventDefault();var a=$('#pPin').value.trim(),b=$('#pPin2').value.trim();
    if(!/^\d{4,6}$/.test(a)){marcar($('#pPin'));return}
    if(a!==b){marcar($('#pPin2'));$('#pErr').innerHTML='<div class="err">Los dos PIN no coinciden.</div>';return}
    api('configurarPin',{usuario:'kevin',nuevo:a,claveInstalacion:$('#pCod').value.trim()}).then(function(r){
      if(!r||!r.ok){$('#pErr').innerHTML='<div class="err">'+esc((r&&r.message)||'No se pudo crear el PIN.')+'</div>';return}
      guardarSesion(r);arrancar();
    }).catch(function(){$('#pErr').innerHTML='<div class="err">No pudimos conectar.</div>'});
  });
}
function salir(){api('cerrarSesion',{}).catch(function(){});S.token='';try{localStorage.removeItem('ds_panel')}catch(e){}vistaLogin()}

/* ——— Estructura ——— */
function arrancar(){
  $('#acc').hidden=false;$('#nav').hidden=false;$('#quien').textContent=(S.usuario==='kevin'?'Kevin':S.usuario==='juancarlos'?'Juan Carlos':S.usuario)+' · '+(ROLES[S.rol]||S.rol);
  Promise.all([cargarVendedores(),cargarPedidos()]).then(function(){pintarTabs();vista()});
  pintarTabs();vista();
}
function pintarTabs(){
  var n=S.pedidos.filter(function(p){return p.estado==='POR_APROBAR'}).length;
  var t=[['pedidos','Pedidos'+(n?'<span class="n">'+n+'</span>':'')],['productos','Productos'],['reportes','Reportes'],['marcas','Marcas y banners'],['enlaces','Enlaces'],['vendedores','Vendedores'],['ajustes','Ajustes']];
  if(S.rol==='administrador')t.push(['stock','Stock']);
  $('#tabs').innerHTML=t.map(function(x){return '<button data-t="'+x[0]+'" class="'+(S.tab===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('');
}
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.tab=b.dataset.t;pintarTabs();vista()});
$('#btnAct').addEventListener('click',function(){toast('Actualizando…');Promise.all([cargarVendedores(),cargarPedidos()]).then(function(){pintarTabs();vista();toast('Listo')})});
$('#btnSalir').addEventListener('click',salir);
function vista(){
  if(!S.token)return;
  ({pedidos:vistaPedidos,productos:vistaProductos,reportes:vistaReportes,marcas:vistaMarcas,enlaces:vistaEnlaces,vendedores:vistaVendedores,ajustes:vistaAjustes,stock:vistaStock})[S.tab]();
}
function nombreVend(id){if(id==='detal')return 'Detal';var v=S.vendedores.filter(function(x){return x.id===id})[0];return v?v.nombre:id}

/* ——— Pedidos ——— */
function cargarPedidos(){return api('listarPedidos',{}).then(function(r){if(r&&r.ok)S.pedidos=r.pedidos})}
function cargarVendedores(){return api('listarVendedores',{}).then(function(r){if(r&&r.ok)S.vendedores=r.vendedores})}
function vistaPedidos(){
  var por=S.pedidos.filter(function(p){return p.estado==='POR_APROBAR'}).length;
  var fs=[['POR_APROBAR','Por aprobar ('+por+')'],['APROBADO','Aprobados'],['CERRADOS','Rechazados y anulados'],['TODOS','Todos']];
  var lista=S.pedidos.filter(function(p){return S.filtro==='TODOS'||(S.filtro==='CERRADOS'?(p.estado==='RECHAZADO'||p.estado==='ANULADO'):p.estado===S.filtro)});
  var h='<h2>Pedidos</h2><div class="chips">'+fs.map(function(f){return '<button class="chip'+(S.filtro===f[0]?' on':'')+'" data-f="'+f[0]+'">'+esc(f[1])+'</button>'}).join('')+'</div>';
  h+=lista.length?lista.map(function(p){
    return '<div class="card pedido" data-id="'+esc(p.id)+'"><div class="row"><div class="g"><b>'+esc(p.negocio)+'</b> <span class="mut">· '+esc(p.id)+'</span><div class="mut">'+esc(nombreVend(p.vendedor))+' · lista '+esc(p.lista)+' · '+esc(p.fecha)+' · '+esc(p.forma_pago)+'</div></div>'
      +'<div style="text-align:right"><div class="big">'+cop(p.total)+'</div><span class="pill p-'+esc(p.estado)+'">'+esc(p.estado.replace('_',' ').toLowerCase())+'</span></div></div></div>'}).join('')
    :'<div class="empty">'+(S.filtro==='POR_APROBAR'?'No hay pedidos por aprobar.':'No hay pedidos en esta lista.')+'</div>';
  $('#app').innerHTML=h;
  $('#app').onclick=function(e){
    var c=e.target.closest('.chip');if(c){S.filtro=c.dataset.f;vistaPedidos();return}
    var p=e.target.closest('.pedido');if(p)detallePedido(p.dataset.id);
  };
}
function textoPedido(p){
  var t='*PEDIDO DISTRISANDER* '+p.id+'\nAsesor: '+nombreVend(p.vendedor)+' · lista '+p.lista+'\n\n*Cliente*\nNegocio: '+p.negocio+'\nRecibe: '+p.recibe+'\nCédula/NIT: '+p.cedula_nit+'\nTeléfono: '+p.telefono+'\nDirección: '+p.direccion+'\nCiudad/barrio: '+p.ciudad_barrio+'\nForma de pago: '+p.forma_pago+'\n';
  if(p.observaciones)t+='Observaciones: '+p.observaciones+'\n';
  t+='\n*Productos*\n';
  p.lineas.forEach(function(l){t+='• '+l.cantidad+' × '+l.nombre+(l.tono?' ('+l.tono+')':'')+' · '+(l.unidad_venta==='caja'?'Caja x'+l.por_caja+' = '+l.unidades+' unid.':'Unidad')+' · '+cop(l.precio)+' = '+cop(l.subtotal)+'\n'});
  return t+'\n*Total: '+cop(p.total)+'* (IVA incluido)';
}
function descuentosHtml(p){
  var d=p.descuentos;if(!d||!d.ahorroTotal)return '';
  var h='<div class="card" style="background:#fbf5e3;border-color:var(--gold)"><b>Para facturar (referencia)</b><div class="mut">El total del pedido no cambia: estos descuentos se aplican al facturar.</div>';
  d.volumen.forEach(function(v){h+='<div class="row" style="margin-top:6px"><span class="g">'+esc(v.nombre)+' · '+v.unidades+' unid. · '+v.pct+' % por volumen</span><b>- '+cop(v.ahorro)+'</b></div>'});
  if(d.prontoPago)h+='<div class="row" style="margin-top:6px"><span class="g">'+esc(d.prontoPago.marca)+': '+d.prontoPago.pct+' % si paga el mismo día de la entrega, de contado o por transferencia (sobre '+cop(d.prontoPago.base)+')</span><b>- '+cop(d.prontoPago.ahorro)+'</b></div>';
  return h+'<div class="row" style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px"><b class="g">Descuento total de referencia</b><b>- '+cop(d.ahorroTotal)+'</b></div></div>';
}
/* ——— Editar un pedido (gerente y administrador) ——— */
function editorPedido(id,items,res){
  var p=S.pedidos.filter(function(x){return x.id===id})[0];if(!p)return;
  var it=items||p.lineas.map(function(l){return {codigo:l.codigo,nombre:l.nombre+(l.tono?' ('+l.tono+')':''),cantidad:l.cantidad,uv:l.unidad_venta,pc:l.por_caja}});
  var h='<div class="row"><h2 class="g" style="margin:0">Editar '+esc(p.id)+'</h2><button class="btn s mini" id="cerr">Cerrar</button></div>'
    +'<div class="mut">'+esc(p.negocio)+' · '+(p.estado==='APROBADO'?'Aprobado: el stock se ajusta solo con lo que cambies.':'Por aprobar: el stock no se mueve hasta aprobarlo.')+'</div>'

function detallePedido(id,extra){
  var p=S.pedidos.filter(function(x){return x.id===id})[0];if(!p)return;

    +'<div class="mut">'+esc(p.id)+' · '+esc(p.fecha)+' · <span class="pill p-'+esc(p.estado)+'">'+esc(p.estado.replace('_',' ').toLowerCase())+'</span></div>'
    +'<div class="card" style="margin-top:10px"><div>Recibe: <b>'+esc(p.recibe)+'</b></div><div>Cédula/NIT: '+esc(p.cedula_nit)+' · Tel: <a href="tel:'+esc(p.telefono)+'">'+esc(p.telefono)+'</a></div><div>'+esc(p.direccion)+' · '+esc(p.ciudad_barrio)+'</div><div>Pago: <b>'+esc(p.forma_pago)+'</b></div>'

    +'<table><thead><tr><th>Producto</th><th class="r">Cant.</th><th class="r">Subtotal</th></tr></thead><tbody>'

    +'</tbody></table><div class="row" style="margin:10px 0"><b class="g">Total</b><b class="big">'+cop(p.total)+'</b></div>'+descuentosHtml(p);
  if(p.revisado_por)h+='<div class="mut">'+esc(p.revisado_por)+'</div>';
  if(extra&&extra.faltantes)h+='<div class="warn"><b>No alcanza el stock:</b><br>'+extra.faltantes.map(function(f){return esc(f.nombre)+': pide '+f.pide+', hay '+f.hay}).join('<br>')+'<br>Aprueba solo si ya lo confirmaste con bodega.</div>';
  if(S.rol==='gerente'||S.rol==='administrador'){
    if(p.estado==='POR_APROBAR'){
      h+='<div class="fld"><label>Motivo (solo para rechazar)<input id="dMot" maxlength="200" placeholder="Ej. Cliente cambió de idea"></label></div><div class="row" style="margin-top:12px">'
        +'<button class="btn ok" id="aprob">'+(extra&&extra.faltantes?'Aprobar de todos modos':'Aprobar')+'</button><button class="btn bad" id="rech">Rechazar</button></div><div class="row" style="margin-top:10px"><button class="btn s" id="editar">Editar pedido</button></div>';
    }else if(p.estado==='APROBADO'){
      h+='<div class="row" style="margin-top:12px"><a class="btn" id="wa" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(textoPedido(p))+'">Compartir a bodega por WhatsApp</a><button class="btn s" id="copPed">Copiar pedido</button><button class="btn s" id="editar">Editar pedido</button></div>'
        +'<div class="fld" style="margin-top:14px"><label>Anular y devolver el stock (solo con orden de Juan Carlos y confirmación de bodega)<input id="dMot" maxlength="200" placeholder="Motivo de la anulación"></label></div><button class="btn bad" id="anul" style="margin-top:8px">Anular pedido</button>';
    }
  }
  modal(h);
  $('#cerr').onclick=cerrar;
  var c=$('#copPed');if(c)c.onclick=function(){copiar(textoPedido(p))};
  var ed=$('#editar');if(ed)ed.onclick=function(){editorPedido(id)};
  var resolver=function(estado,forzar){
    var mot=($('#dMot')||{}).value||'';
    if(estado!=='APROBADO'&&!mot.trim()){marcar($('#dMot'));toast('Escribe el motivo');return}
    var btns=document.querySelectorAll('#sheet .btn');btns.forEach(function(b){b.disabled=true});
    api('resolverPedido',{id:id,estado:estado,motivo:mot.trim(),forzar:!!forzar},nuevaLlave()).then(function(r){
      if(r&&r.faltantes){btns.forEach(function(b){b.disabled=false});detallePedido(id,{faltantes:r.faltantes});return}
      if(!r||!r.ok){btns.forEach(function(b){b.disabled=false});toast((r&&r.message)||'No se pudo guardar');return}
      toast(r.message||'Listo');
      return cargarPedidos().then(function(){pintarTabs();vistaPedidos();detallePedido(id)});
    }).catch(function(){btns.forEach(function(b){b.disabled=false});toast('No pudimos conectar')});
  };
  var a=$('#aprob');if(a)a.onclick=function(){resolver('APROBADO',!!(extra&&extra.faltantes))};
  var r=$('#rech');if(r)r.onclick=function(){resolver('RECHAZADO')};

var XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function cargarXlsx(){return new Promise(function(ok,no){if(window.XLSX)return ok();var s=document.createElement('script');s.src=XLSX_URL;s.onload=ok;s.onerror=function(){no(new Error('No se pudo cargar el lector de Excel'))};document.head.appendChild(s)})}
var FILAS=null,MODO_STOCK='semanal';
/* Números como se escriben en Colombia: «1.200» son mil doscientos y «12,5» es doce y medio (un texto así no debe leerse como 1,2). */
function aNumero(v){
  if(typeof v==='number')return isFinite(v)?v:0;
  var s=String(v==null?'':v).trim().replace(/\s/g,'');
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d+,\d+$/.test(s))s=s.replace(',','.');
  else s=s.replace(/[^0-9.\-]/g,'');
  var n=Number(s);return isFinite(n)?n:0;
}
function vistaStock(){
  $('#app').innerHTML='<h2>Stock</h2><div class="empty">Cargando…</div>';
  api('estadoStock',{}).then(function(e){
    var est=(e&&e.ok)?e:{ultimaCarga:null,ultimoRestock:null,restocksMes:0,restocksIncluidos:3};
    var lleno=est.restocksMes>=est.restocksIncluidos;
    $('#app').innerHTML='<h2>Stock</h2><div class="card"><div class="mut">Última carga semanal: <b>'+esc(est.ultimaCarga||'ninguna todavía')+'</b></div><div class="mut">Último restock: <b>'+esc(est.ultimoRestock||'ninguno')+'</b></div>'
      +'<div class="mut">Restocks este mes: <b>'+est.restocksMes+' de '+est.restocksIncluidos+'</b> incluidos en el soporte'+(lleno?' <span class="pill p-POR_APROBAR">límite del mes alcanzado</span>':'')+'</div></div>'
      +'<div class="chips"><button class="chip'+(MODO_STOCK==='semanal'?' on':'')+'" data-m="semanal">Carga semanal de Factusol</button><button class="chip'+(MODO_STOCK==='restock'?' on':'')+'" data-m="restock">Restock (mercancía nueva)</button></div>'
      +'<div class="card"><p class="mut">'+(MODO_STOCK==='semanal'
        ?'Cada lunes (o el primer día hábil): sube el Excel que exporta Factusol. <b>REEMPLAZA</b> todo el stock y reinicia el descuento de los pedidos aprobados. Los códigos deben existir en Productos.'
        :'Cuando llega mercancía nueva entre un lunes y otro: sube el Excel con las unidades que <b>LLEGARON</b>. Se <b>SUMAN</b> al stock actual; no se reinicia nada y lo aprobado sigue descontado.')+'</p>'
      +'<label class="fld"><span class="mut">Archivo Excel (.xlsx, .xls) o CSV</span><input type="file" id="fArch" accept=".xlsx,.xls,.csv"></label><div id="stBody"></div></div>';
    $('#app').onclick=function(ev){var c=ev.target.closest('.chip');if(c&&c.dataset.m){MODO_STOCK=c.dataset.m;FILAS=null;vistaStock()}};
    $('#fArch').onchange=function(){

      cargarXlsx().then(function(){return f.arrayBuffer()}).then(function(buf){
        var wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],filas=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        var head=0;while(head<filas.length&&filas[head].filter(function(c){return String(c).trim()}).length<2)head++;

      }).catch(function(e){$('#stBody').innerHTML='<div class="err">'+esc(e.message||'No se pudo leer el archivo')+'</div>'});
    };
  }).catch(function(){$('#app').innerHTML='<div class="err">No pudimos conectar.</div>'});
}
function mapaColumnas(){
  var cab=FILAS.cab,ic=0,iu=1;
  cab.forEach(function(c,i){if(/c[oó]d|referen|art[ií]culo/i.test(c)&&!ic)ic=i;});
  cab.forEach(function(c,i){if(/stock|exist|unid|cant|lleg/i.test(c)&&i!==ic)iu=i});
  var op=function(sel){return cab.map(function(c,i){return '<option value="'+i+'"'+(i===sel?' selected':'')+'>'+esc(c||('Columna '+(i+1)))+'</option>'}).join('')};
  var restock=MODO_STOCK==='restock';
  $('#stBody').innerHTML='<div class="two fld"><label>Columna del código<select id="cC">'+op(ic)+'</select></label><label>Columna de '+(restock?'unidades que llegaron':'unidades')+'<select id="cU">'+op(iu)+'</select></label></div><div id="stPrev"></div>'
    +'<div class="row" style="margin-top:10px"><button class="btn" id="stGo">'+(restock?'Revisar el restock':'Cargar stock')+'</button></div><div id="stRes"></div>';

  };
  $('#cC').onchange=prev;$('#cU').onchange=prev;prev();
  $('#stGo').onclick=function(){
    if(restock)return revisarRestock();
    preguntar('Esto REEMPLAZA todo el stock actual con las '+FILAS.salida.length+' filas del archivo y reinicia el descuento de los pedidos aprobados. ¿Continuar?',function(){enviarSemanal()});

/* ——— Productos y precios ——— */
var NOMBRE_LISTA={1:'Bucaramanga',2:'Sábana y pueblos',3:'Pamplona/Cúcuta',4:'Arauca/Tibú',5:'Detal'};
function problemasProd(p){
  var pr=[];
  if(!p.activo)return pr;
  if([1,2,3,4,5].some(function(l){return !p.precios[l]}))pr.push('precio');
  if(p.stock===null||p.stock<=0)pr.push('stock');
  return pr;
}
function vistaProductos(){
  $('#app').innerHTML='<h2>Productos y precios</h2><div class="empty">Cargando…</div>';

    S.productos=r.productos;S.marcas=r.marcas;S.puedeTodo=r.puedeEditarTodo;pintarProductos();
  }).catch(function(){$('#app').innerHTML='<div class="err">No pudimos conectar.</div>'});
}
function pintarProductos(){
  var f=S.fprod||'todos',q=(S.qprod||'').toLowerCase(),cnt={precio:0,stock:0,inactivos:0};
  S.productos.forEach(function(p){problemasProd(p).forEach(function(x){cnt[x]++});if(!p.activo)cnt.inactivos++});
  var lista=S.productos.filter(function(p){
    if(q&&(p.codigo+' '+p.nombre+' '+p.tono_presentacion+' '+p.marca).toLowerCase().indexOf(q)<0)return false;
    if(f==='todos')return true;if(f==='inactivos')return !p.activo;return problemasProd(p).indexOf(f)>=0;
  });
  var chips=[['todos','Todos ('+S.productos.length+')'],['precio','Sin precio ('+cnt.precio+')'],['stock','Sin stock ('+cnt.stock+')'],['inactivos','Apagados ('+cnt.inactivos+')']];
  var h='<div class="row"><h2 class="g">Productos y precios</h2>'+(S.puedeTodo?'<button class="btn s mini" id="impP">Importar Excel</button><button class="btn mini" id="nuevoP">Nuevo producto</button>':'')+'</div>'
    +'<div class="chips">'+chips.map(function(c){return '<button class="chip'+(f===c[0]?' on':'')+'" data-f="'+c[0]+'">'+esc(c[1])+'</button>'}).join('')+'</div>'
    +'<input id="qP" placeholder="Buscar por código, nombre o marca" value="'+esc(S.qprod||'')+'" style="margin-bottom:12px">';
  h+=lista.length?lista.map(function(p){
    var pr=problemasProd(p);
    return '<div class="card pedido '+(p.activo?'':'off')+'" data-c="'+esc(p.codigo)+'"><div class="row"><div class="g"><b>'+esc(p.nombre)+'</b>'+(p.tono_presentacion?' <span class="mut">('+esc(p.tono_presentacion)+')</span>':'')+' <span class="mut">· '+esc(p.codigo)+' · '+esc(p.marca)+'</span>'
      +'<div class="mut">'+[1,2,3,4,5].map(function(l){return NOMBRE_LISTA[l]+' '+(p.precios[l]?cop(p.precios[l]):'<b style="color:var(--bad)">—</b>')}).join(' · ')+'</div>'
      +'<div class="mut">'+(p.unidad_venta==='caja'?'Caja x'+p.unidades_por_caja:'Unidad')+' · Stock: '+(p.stock===null?'sin cargar':p.stock+' unid.')+'</div></div>'
      +'<div style="text-align:right">'+(p.activo?'':'<span class="pill p-RECHAZADO">apagado</span>')+(pr.length&&p.activo?'<div class="mut" style="color:var(--warn)">'+esc(pr.join(', '))+'</div>':'')+'</div></div></div>'}).join(''):'<div class="empty">No hay productos en esta lista.</div>';
  $('#app').innerHTML=h;
  $('#qP').oninput=function(){S.qprod=this.value;var pos=this.selectionStart;pintarProductos();var n=$('#qP');n.focus();n.setSelectionRange(pos,pos)};
  $('#app').onclick=function(e){
    var c=e.target.closest('.chip');if(c){S.fprod=c.dataset.f;pintarProductos();return}
    var b=e.target.closest('button');if(b&&b.id==='nuevoP')return formProducto();if(b&&b.id==='impP')return importarExcel();
    var k=e.target.closest('.pedido');if(k)formProducto(k.dataset.c);
  };
}

var CAMPOS_IMP=[['codigo','Código',/c[oó]d|ref|sku/i],['marca','Marca',/marca|l[ií]nea/i],['nombre','Nombre',/nombre|producto|art[ií]culo/i],['tono_presentacion','Tono o presentación',/tono|presentaci|variante|color/i],
  ['descripcion','Descripción',/descrip|detalle/i],['unidad_venta','Se vende por (unidad/caja)',/venta|vende/i],['unidades_por_caja','Unidades por caja',/caja/i],['foto','Foto',/foto|imagen/i],['novedad','Novedad',/novedad|nuevo/i],['activo','Activo',/activo|habilitado/i],
  ['p1','Precio lista 1 · Bucaramanga',/lista.?1|bucaramanga/i],['p2','Precio lista 2 · Sábana y pueblos',/lista.?2|s[aá]bana|pueblos/i],['p3','Precio lista 3 · Pamplona/Cúcuta',/lista.?3|pamplona|c[uú]cuta/i],['p4','Precio lista 4 · Arauca/Tibú',/lista.?4|arauca|tib[uú]/i],['p5','Precio lista 5 · Detal',/lista.?5|detal/i]];
var IMP=null;
function importarExcel(){
  modal('<div class="row"><h2 class="g" style="margin:0">Importar productos y precios</h2><button class="btn s mini" id="cerr">Cerrar</button></div>'
    +'<p class="mut">Sube el Excel de Juan Carlos (una fila por producto, con una columna de precio por lista). Primero se valida todo y, si hay un solo error, no se escribe nada.</p>'
    +'<label class="fld"><span class="mut">Archivo Excel (.xlsx, .xls) o CSV</span><input type="file" id="iArch" accept=".xlsx,.xls,.csv"></label><div id="iBody"></div>');
  $('#cerr').onclick=cerrar;
  $('#iArch').onchange=function(){
    var f=this.files[0];if(!f)return;$('#iBody').innerHTML='<p class="mut">Leyendo…</p>';
    cargarXlsx().then(function(){return f.arrayBuffer()}).then(function(buf){
      var wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],filas=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      var head=0;while(head<filas.length&&filas[head].filter(function(c){return String(c).trim()}).length<3)head++;
      if(head>=filas.length)throw new Error('No encontré una fila de encabezados.');
      IMP={cab:filas[head].map(String),datos:filas.slice(head+1).map(function(r,i){return {r:r,n:head+i+2}}).filter(function(x){return x.r.some(function(c){return String(c).trim()})})};
      mapaImp();
    }).catch(function(e){$('#iBody').innerHTML='<div class="err">'+esc(e.message||'No se pudo leer el archivo')+'</div>'});
  };
}
function mapaImp(){
  var usados={},sel={};
  CAMPOS_IMP.forEach(function(c){IMP.cab.forEach(function(h,i){if(sel[c[0]]===undefined&&!usados[i]&&c[2].test(h)){sel[c[0]]=i;usados[i]=1}})});
  var op=function(v){return '<option value="-1">— No usar —</option>'+IMP.cab.map(function(c,i){return '<option value="'+i+'"'+(i===v?' selected':'')+'>'+esc(c||('Columna '+(i+1)))+'</option>'}).join('')};
  $('#iBody').innerHTML='<p class="mut">'+IMP.datos.length+' filas con datos. Revisa que cada campo apunte a la columna correcta:</p><div class="fld">'+CAMPOS_IMP.map(function(c){return '<label>'+esc(c[1])+'<select data-c="'+c[0]+'">'+op(sel[c[0]]===undefined?-1:sel[c[0]])+'</select></label>'}).join('')+'</div>'
    +'<label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="iDes" style="width:auto;min-height:0"> Apagar los productos que NO vienen en este archivo</label><div class="row" style="margin-top:12px"><button class="btn" id="iVal">Validar</button></div><div id="iRes"></div>';
  $('#iVal').onclick=function(){enviarImp('validar')};
}
function filasImp(){
  var col={};document.querySelectorAll('#iBody select[data-c]').forEach(function(s){col[s.dataset.c]=Number(s.value)});
  var v=function(r,k){return col[k]>=0?r[col[k]]:undefined};
  return IMP.datos.map(function(x){
    var por=v(x.r,'unidades_por_caja'),uv=String(v(x.r,'unidad_venta')==null?'':v(x.r,'unidad_venta')).trim().toLowerCase();
    if(!uv)uv=aNumero(por)>1?'caja':'unidad';
    var nov=v(x.r,'novedad'),act=v(x.r,'activo');
    return {_fila:x.n,codigo:String(v(x.r,'codigo')==null?'':v(x.r,'codigo')).trim(),marca:v(x.r,'marca'),nombre:v(x.r,'nombre'),tono_presentacion:v(x.r,'tono_presentacion'),descripcion:v(x.r,'descripcion'),
      unidad_venta:uv,unidades_por_caja:por,foto:v(x.r,'foto'),novedad:nov===undefined?false:/^(si|sí|1|true|x)$/i.test(String(nov).trim()),activo:act===undefined?true:!/^(no|0|false)$/i.test(String(act).trim()),
      precios:{1:v(x.r,'p1'),2:v(x.r,'p2'),3:v(x.r,'p3'),4:v(x.r,'p4'),5:v(x.r,'p5')}};
  });
}
function enviarImp(modo){
  var b=modo==='validar'?$('#iVal'):$('#iApl');b.disabled=true;
  api('importarProductos',{filas:filasImp(),modo:modo,desactivarFaltantes:$('#iDes').checked},modo==='aplicar'?nuevaLlave():undefined).then(function(r){
    b.disabled=false;
    if(!r||(!r.validado&&!r.ok)){$('#iRes').innerHTML='<div class="err">'+esc((r&&r.message)||'No se pudo importar')+'</div>';return}
    var h='';
    if(r.aplicado){h='<div class="warn" style="background:#dff3e4;color:var(--ok)">'+esc(r.message)+'</div>';$('#iRes').innerHTML=h;toast('Importación lista');return}
    if(!r.ok){h='<div class="err"><b>'+esc(r.message)+'</b></div><table><thead><tr><th>Fila</th><th>Código</th><th>Problema</th></tr></thead><tbody>'+r.errores.map(function(e){return '<tr><td>'+e.fila+'</td><td>'+esc(e.codigo)+'</td><td>'+esc(e.message)+'</td></tr>'}).join('')+'</tbody></table>'+(r.nErrores>r.errores.length?'<p class="mut">Se muestran los primeros '+r.errores.length+'.</p>':'')}
    else h='<div class="warn" style="background:#dff3e4;color:var(--ok)">'+esc(r.message)+(r.desactivados?' Se apagarán '+r.desactivados+' productos que no vienen en el archivo.':'')+'</div><button class="btn ok" id="iApl">Aplicar importación</button>';
    $('#iRes').innerHTML=h;var a=$('#iApl');if(a)a.onclick=function(){enviarImp('aplicar')};
  }).catch(function(){b.disabled=false;$('#iRes').innerHTML='<div class="err">No pudimos conectar.</div>'});
}

/* ——— Reportes ——— */
var REP={preset:'mes',desde:'',hasta:'',datos:null,cli:'valor',prod:'valor'};
function fTxt(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function rangoRep(p){
  var h=new Date(),y=h.getFullYear(),m=h.getMonth();
  if(p==='pasado')return [fTxt(new Date(y,m-1,1)),fTxt(new Date(y,m,0))];
  if(p==='30')return [fTxt(new Date(h.getTime()-29*864e5)),fTxt(h)];
  if(p==='anio')return [fTxt(new Date(y,0,1)),fTxt(h)];
  if(p==='otro')return [REP.desde,REP.hasta];
  return [fTxt(new Date(y,m,1)),fTxt(h)];
}
function vistaReportes(){
  var r=rangoRep(REP.preset);REP.desde=r[0];REP.hasta=r[1];
  $('#app').innerHTML='<h2>Reportes</h2><div class="empty">Calculando…</div>';
  api('reportes',{desde:REP.desde,hasta:REP.hasta}).then(function(x){
    if(!x||!x.ok){$('#app').innerHTML='<h2>Reportes</h2><div class="err">'+esc((x&&x.message)||'No se pudo calcular el reporte.')+'</div>'+barraPeriodo();ligarPeriodo();return}
    REP.datos=x;pintarReporte();
  }).catch(function(){$('#app').innerHTML='<div class="err">No pudimos conectar.</div>'});
}
function barraPeriodo(){
  var ps=[['mes','Este mes'],['pasado','Mes pasado'],['30','Últimos 30 días'],['anio','Este año'],['otro','Otro período']];
  return '<div class="chips">'+ps.map(function(p){return '<button class="chip'+(REP.preset===p[0]?' on':'')+'" data-p="'+p[0]+'">'+p[1]+'</button>'}).join('')+'</div>'
    +(REP.preset==='otro'?'<div class="fechas"><label>Desde<input type="date" id="rDes" value="'+esc(REP.desde)+'"></label><label>Hasta<input type="date" id="rHas" value="'+esc(REP.hasta)+'"></label><button class="btn mini" id="rVer">Ver</button></div>':'');
}
function ligarPeriodo(){
  $('#app').onclick=function(e){
    var c=e.target.closest('.chip');
    if(c&&c.dataset.p){REP.preset=c.dataset.p;if(REP.preset==='otro'){pintarReporte(true)}else vistaReportes();return}
    if(c&&c.dataset.cl){REP.cli=c.dataset.cl;pintarReporte();return}
    if(c&&c.dataset.pr){REP.prod=c.dataset.pr;pintarReporte();return}
    var b=e.target.closest('button');if(!b)return;
    if(b.id==='rVer'){REP.desde=$('#rDes').value;REP.hasta=$('#rHas').value;vistaReportes()}
    if(b.id==='rCopiar')copiar(resumenRep());
    if(b.id==='rCsv')descargarCsv();
  };
}
function resumenRep(){
  var d=REP.datos,r=d.resumen,t='*REPORTE DISTRISANDER* '+d.desde+' al '+d.hasta+'\nVentas aprobadas: '+cop(r.ventas)+' ('+r.pedidos+' pedidos, ticket '+cop(r.ticket)+')\nClientes que compraron: '+r.clientes+'\nPor aprobar: '+r.estados.POR_APROBAR.n+' ('+cop(r.estados.POR_APROBAR.total)+')\n\n*Por vendedor*\n';
  d.vendedores.filter(function(v){return v.ventas>0}).forEach(function(v){t+='• '+v.nombre+': '+cop(v.ventas)+' ('+v.pedidos+' pedidos)\n'});
  t+='\n*Por marca*\n';d.marcas.forEach(function(m){t+='• '+m.marca+': '+cop(m.ventas)+'\n'});
  t+='\n*Más vendidos*\n';d.productos.slice(0,5).forEach(function(p){t+='• '+p.nombre+(p.tono?' ('+p.tono+')':'')+': '+cop(p.ventas)+'\n'});
  return t+'\n(Basado en los pedidos aprobados del catálogo, no en las facturas de Factusol.)';
}
function descargarCsv(){
  var d=REP.datos,fila=function(a){return a.map(function(v){v=String(v==null?'':v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')};
  var l=[fila(['Negocio','Teléfono','Pedidos','Ventas','Ticket','Primer pedido','Último pedido','Días desde el último','Días entre pedidos','Regularidad','Vendedores'])];
  d.clientes.forEach(function(c){l.push(fila([c.negocio,c.telefono,c.pedidos,c.ventas,c.ticket,c.primero,c.ultimo,c.diasDesdeUltimo,c.intervaloDias==null?'':c.intervaloDias,c.regularidad,c.vendedores.join(' / ')]))});
  var blob=new Blob(['﻿'+l.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='clientes-'+d.desde+'-a-'+d.hasta+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
}
function pintarReporte(soloPeriodo){
  var d=REP.datos;
  if(soloPeriodo||!d){$('#app').innerHTML='<h2>Reportes</h2>'+barraPeriodo();ligarPeriodo();return}
  var r=d.resumen,max=function(a,k){return a.reduce(function(m,x){return Math.max(m,x[k])},0)||1};
  var h='<div class="row"><h2 class="g">Reportes</h2><button class="btn s mini" id="rCopiar">Copiar resumen</button></div>'+barraPeriodo();
  h+='<div class="rcards"><div class="rcard"><b>'+cop(r.ventas)+'</b><span>Ventas aprobadas</span></div><div class="rcard"><b>'+r.pedidos+'</b><span>Pedidos aprobados</span></div><div class="rcard"><b>'+cop(r.ticket)+'</b><span>Ticket promedio</span></div><div class="rcard"><b>'+r.clientes+'</b><span>Clientes que compraron</span></div></div>'
    +'<p class="mut">Por aprobar: '+r.estados.POR_APROBAR.n+' ('+cop(r.estados.POR_APROBAR.total)+') · Rechazados: '+r.estados.RECHAZADO.n+' · Anulados: '+r.estados.ANULADO.n+'. '+esc(d.aviso)+'</p>';
  if(!r.pedidos){h+='<div class="empty">No hay pedidos aprobados en este período.</div>';$('#app').innerHTML=h;ligarPeriodo();return}
  var mx=max(d.serie,'ventas');
  h+='<div class="card"><b>Ventas por día</b><div class="dias">'+d.serie.map(function(x){return '<div title="'+esc(x.dia)+' · '+cop(x.ventas)+'" style="height:'+Math.max(4,Math.round(x.ventas/mx*100))+'%"></div>'}).join('')+'</div><div class="mut"><span>'+esc(d.serie[0].dia)+'</span><span>'+esc(d.serie[d.serie.length-1].dia)+'</span></div></div>';
  var mv=max(d.vendedores,'ventas');
  h+='<div class="card"><b>Por vendedor</b>'+d.vendedores.map(function(v){return '<div style="margin-top:10px"><div class="row"><span class="g">'+esc(v.nombre)+'</span><b>'+cop(v.ventas)+'</b></div><div class="barra"><i style="width:'+Math.round(v.ventas/mv*100)+'%"></i></div><div class="mut">'+v.pedidos+(v.pedidos===1?' pedido':' pedidos')+' · '+v.unidades+' unidades · '+v.clientes+(v.clientes===1?' cliente':' clientes')+' · ticket '+cop(v.ticket)+(v.pendientes?' · <b style="color:var(--warn)">'+v.pendientes+' por aprobar ('+cop(v.valorPendiente)+')</b>':'')+'</div></div>'}).join('')+'</div>';
  var mm=max(d.marcas,'ventas'),tm=d.marcas.reduce(function(s,m){return s+m.ventas},0)||1;
  h+='<div class="card"><b>Por marca</b>'+d.marcas.map(function(m){return '<div style="margin-top:10px"><div class="row"><span class="g">'+esc(m.marca)+'</span><b>'+cop(m.ventas)+'</b> <span class="mut">'+Math.round(m.ventas/tm*100)+' %</span></div><div class="barra"><i style="width:'+Math.round(m.ventas/mm*100)+'%"></i></div></div>'}).join('')+'</div>';
  var ps=d.productos.slice().sort(function(a,b){return REP.prod==='valor'?b.ventas-a.ventas:b.unidades-a.unidades}).slice(0,15);
  h+='<div class="card"><div class="row"><b class="g">Productos más pedidos</b><button class="chip'+(REP.prod==='valor'?' on':'')+'" data-pr="valor">Por valor</button><button class="chip'+(REP.prod==='unid'?' on':'')+'" data-pr="unid">Por unidades</button></div><table><thead><tr><th>Producto</th><th class="r">Cant.</th><th class="r">Valor</th></tr></thead><tbody>'
    +ps.map(function(p){return '<tr><td>'+esc(p.nombre)+(p.tono?' <span class="mut">('+esc(p.tono)+')</span>':'')+'<div class="mut">'+esc(p.marca)+'</div></td><td class="r">'+p.cantidad+(p.unidad_venta==='caja'?' cajas<div class="mut">'+p.unidades+' unid.</div>':'')+'</td><td class="r">'+cop(p.ventas)+'</td></tr>'}).join('')+'</tbody></table></div>';
  h+='<div class="card"><b>Por lista de precios (zona)</b><table><tbody>'+d.listas.map(function(l){return '<tr><td>Lista '+esc(l.lista)+' · '+esc(NOMBRE_LISTA[l.lista]||'')+'</td><td class="r">'+l.pedidos+' pedidos</td><td class="r">'+cop(l.ventas)+'</td></tr>'}).join('')+'</tbody></table></div>';
  var cl=d.clientes.slice();
  if(REP.cli==='frecuencia')cl.sort(function(a,b){return b.pedidos-a.pedidos||b.ventas-a.ventas});
  if(REP.cli==='reactivar')cl=cl.filter(function(c){return c.diasDesdeUltimo>Math.max(45,(c.intervaloDias||0)*2)}).sort(function(a,b){return b.diasDesdeUltimo-a.diasDesdeUltimo});
  h+='<div class="card"><div class="row"><b class="g">Clientes</b><button class="btn s mini" id="rCsv">Descargar CSV</button></div><div class="chips" style="margin:8px 0">'+[['valor','Los que más compran'],['frecuencia','Los que piden más seguido'],['reactivar','Para reactivar']].map(function(c){return '<button class="chip'+(REP.cli===c[0]?' on':'')+'" data-cl="'+c[0]+'">'+c[1]+'</button>'}).join('')+'</div>'
    +(cl.length?'<table><thead><tr><th>Cliente</th><th class="r">Pedidos</th><th class="r">Compró</th></tr></thead><tbody>'+cl.slice(0,25).map(function(c){
      return '<tr><td><b>'+esc(c.negocio)+'</b><div class="mut">'+esc(c.telefono)+' · '+esc(c.vendedores.join(' / '))+'</div><span class="pill '+(c.regularidad==='Muy frecuente'?'p-APROBADO':c.regularidad==='Mensual'?'p-POR_APROBAR':'n')+'">'+esc(c.regularidad)+'</span> <span class="mut">'+(c.intervaloDias!=null?'cada '+c.intervaloDias+' días · ':'')+'último hace '+c.diasDesdeUltimo+' días</span></td><td class="r">'+c.pedidos+'</td><td class="r">'+cop(c.ventas)+'<div class="mut">ticket '+cop(c.ticket)+'</div></td></tr>'}).join('')+'</tbody></table>':'<div class="empty">Ningún cliente en esta lista.</div>')+'</div>';
  $('#app').innerHTML=h;ligarPeriodo();
}

/* ——— Marcas y banners ——— */
var MB={marcas:[],banners:[],puedeMarcas:false};
function vistaMarcas(){
  $('#app').innerHTML='<h2>Marcas y banners</h2><div class="empty">Cargando…</div>';
  api('listarMarcasBanners',{}).then(function(r){
    if(!r||!r.ok){$('#app').innerHTML='<div class="err">'+esc((r&&r.message)||'No se pudieron leer.')+'</div>';return}
    MB={marcas:r.marcas,banners:r.banners,puedeMarcas:r.puedeMarcas};pintarMarcas();
  }).catch(function(){$('#app').innerHTML='<div class="err">No pudimos conectar.</div>'});
}
function pintarMarcas(){
  var hoy=fTxt(new Date());
  var vigente=function(b){return b.activo&&(!b.desde||b.desde<=hoy)&&(!b.hasta||b.hasta>=hoy)};
  var h='<div class="row"><h2 class="g">Banners de la portada</h2><button class="btn mini" id="nuevoB">Nuevo banner</button></div><p class="mut">Las promociones que rotan arriba del catálogo. Un banner no se borra: se apaga. La imagen es opcional (sin imagen se muestra el texto sobre fondo negro y dorado).</p>';
  h+=MB.banners.length?MB.banners.map(function(b){
    return '<div class="card pedido '+(b.activo?'':'off')+'" data-b="'+b.orden+'"><div class="row"><div class="g"><b>'+esc(b.titulo)+'</b><div class="mut">'+(b.desde||'sin fecha de inicio')+' → '+(b.hasta||'sin fecha final')+(b.imagen?' · '+esc(b.imagen):'')+'</div></div>'
      +(vigente(b)?'<span class="pill p-APROBADO">se muestra hoy</span>':b.activo?'<span class="pill n">fuera de fechas</span>':'<span class="pill p-RECHAZADO">apagado</span>')+'</div></div>'}).join(''):'<div class="empty">Todavía no hay banners.</div>';
  h+='<div class="row" style="margin-top:22px"><h2 class="g">Marcas</h2>'+(MB.puedeMarcas?'<button class="btn mini" id="nuevaM">Nueva marca</button>':'')+'</div>'+(MB.puedeMarcas?'':'<p class="mut">Solo el administrador cambia las marcas.</p>');
  h+=MB.marcas.map(function(m){
    return '<div class="card '+(MB.puedeMarcas?'pedido':'')+'" data-m="'+esc(m.marca)+'"><div class="row"><div class="g"><b>'+esc(m.marca)+'</b><div class="mut">Orden '+m.orden+(m.descripcion?' · '+esc(m.descripcion):'')+(m.logo?' · logo '+esc(m.logo):'')+'</div></div></div></div>'}).join('');
  $('#app').innerHTML=h;
  $('#app').onclick=function(e){
    if(e.target.closest('#nuevoB'))return formBanner();
    if(e.target.closest('#nuevaM'))return formMarca();
    var b=e.target.closest('[data-b]');if(b)return formBanner(Number(b.dataset.b));
    var m=e.target.closest('[data-m]');if(m&&MB.puedeMarcas)formMarca(m.dataset.m);
  };
}
function formBanner(orden){
  var nuevo=orden===undefined,b=nuevo?{orden:0,titulo:'',imagen:'',desde:'',hasta:'',activo:true}:MB.banners.filter(function(x){return x.orden===orden})[0];
  if(!b)return;
  modal('<div class="row"><h2 class="g" style="margin:0">'+(nuevo?'Nuevo banner':'Editar banner')+'</h2><button class="btn s mini" id="cerr">Cerrar</button></div>'
    +'<form class="fld" id="fB"><label>Texto del banner<input id="bTit" value="'+esc(b.titulo)+'" maxlength="80" placeholder="Ej. Black Friday: 10 % en Kerasolis"></label>'
    +'<label>Imagen (opcional, nombre del archivo)<input id="bImg" value="'+esc(b.imagen)+'" maxlength="60" placeholder="black-friday.jpg"></label>'
    +'<div class="two"><label>Desde<input type="date" id="bDes" value="'+esc(b.desde)+'"></label><label>Hasta<input type="date" id="bHas" value="'+esc(b.hasta)+'"></label></div>'
    +'<label>Estado<select id="bAct"><option value="1"'+(b.activo?' selected':'')+'>Activo</option><option value="0"'+(b.activo?'':' selected')+'>Apagado</option></select></label>'
    +'<p class="mut">Dejar una fecha vacía significa «sin límite». El banner se muestra solo dentro de sus fechas.</p><div id="bErr"></div>'
    +'<div class="row"><button class="btn" type="submit">Guardar</button><button class="btn s" type="button" id="no">Cancelar</button></div></form>');
  $('#cerr').onclick=cerrar;$('#no').onclick=cerrar;
  $('#fB').onsubmit=function(e){
    e.preventDefault();var s=this.querySelector('button[type=submit]');s.disabled=true;
    api('guardarBanner',{banner:{orden:b.orden,titulo:$('#bTit').value,imagen:$('#bImg').value.trim(),desde:$('#bDes').value,hasta:$('#bHas').value,activo:$('#bAct').value==='1'},crear:nuevo},nuevaLlave()).then(function(r){
      s.disabled=false;
      if(!r||!r.ok){var m={titulo:'#bTit',imagen:'#bImg',desde:'#bDes',hasta:'#bHas'}[r&&r.campo];if(m)marcar($(m));$('#bErr').innerHTML='<div class="err">'+esc((r&&r.message)||'No se pudo guardar')+'</div>';return}
      cerrar();toast(r.message);vistaMarcas();
    }).catch(function(){s.disabled=false;$('#bErr').innerHTML='<div class="err">No pudimos conectar.</div>'});
  };
}
function formMarca(nombre){
  var nueva=nombre===undefined,m=nueva?{marca:'',logo:'',orden:MB.marcas.length+1,descripcion:''}:MB.marcas.filter(function(x){return x.marca===nombre})[0];
  if(!m)return;
  modal('<div class="row"><h2 class="g" style="margin:0">'+(nueva?'Nueva marca':esc(m.marca))+'</h2><button class="btn s mini" id="cerr">Cerrar</button></div>'
    +'<form class="fld" id="fM2"><label>Nombre de la marca<input id="mNom" value="'+esc(m.marca)+'" maxlength="40" '+(nueva?'':'readonly')+'></label>'
    +'<label>Descripción corta (opcional)<input id="mDes" value="'+esc(m.descripcion)+'" maxlength="80" placeholder="Ej. Maquillaje"></label>'
    +'<div class="two"><label>Orden en el catálogo<input id="mOrd" value="'+m.orden+'" inputmode="numeric"></label><label>Logo (nombre del archivo, opcional)<input id="mLog" value="'+esc(m.logo)+'" maxlength="60" placeholder="kerasolis.png"></label></div>'
    +'<div id="mErr"></div><div class="row"><button class="btn" type="submit">Guardar</button><button class="btn s" type="button" id="no">Cancelar</button></div></form>');
  $('#cerr').onclick=cerrar;$('#no').onclick=cerrar;
  $('#fM2').onsubmit=function(e){
    e.preventDefault();var s=this.querySelector('button[type=submit]');s.disabled=true;
    api('guardarMarca',{marca:{marca:$('#mNom').value,descripcion:$('#mDes').value,orden:aNumero($('#mOrd').value),logo:$('#mLog').value.trim()},crear:nueva},nuevaLlave()).then(function(r){
      s.disabled=false;
      if(!r||!r.ok){var x={marca:'#mNom',logo:'#mLog',orden:'#mOrd'}[r&&r.campo];if(x)marcar($(x));$('#mErr').innerHTML='<div class="err">'+esc((r&&r.message)||'No se pudo guardar')+'</div>';return}
      cerrar();toast(r.message);vistaMarcas();
    }).catch(function(){s.disabled=false;$('#mErr').innerHTML='<div class="err">No pudimos conectar.</div>'});
  };
}

/* ——— Inicio ——— */
setInterval(function(){if(S.token&&document.visibilityState==='visible'&&S.tab==='pedidos'&&$('#ov').hidden){cargarPedidos().then(function(){pintarTabs();vistaPedidos()})}},45000);
if(S.token){api('miSesion',{}).then(function(r){if(r&&r.ok){S.rol=r.rol;S.usuario=r.usuario;arrancar()}else vistaLogin()}).catch(function(){vistaLogin('No pudimos conectar. Intenta de nuevo.')})}
else{api('estadoInstalacion',{}).then(function(r){if(r&&r.ok&&!r.adminConfigurado)vistaPrimera();else vistaLogin()}).catch(function(){vistaLogin()})}
})();
</script>
