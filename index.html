<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Distrisander Cosméticos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Negro y dorado, minimalista. Fondo cálido para que las fotos de producto resalten; bordes muy redondeados. */
:root{--ink:#111111;--gold:#C9A24B;--gold-d:#9a7a2e;--bg:#faf7f1;--card:#ffffff;--line:#ece5d6;--mut:#6d665a;--ok:#2f6b3f;--bad:#a63a2e;
--r:22px;--disp:'Playfair Display',Georgia,serif;--body:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-bottom:96px}
button{font:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--ink);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.hd{display:flex;align-items:center;gap:12px;padding-block:14px}
.mark{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font:600 17px var(--disp);color:var(--gold);flex:none;letter-spacing:.02em}
.hd h1{margin:0;font:600 20px/1.1 var(--disp)}
.hd small{display:block;color:#b9b1a0;font:400 12px var(--body);margin-top:3px}
.who{margin-left:auto;font-size:12px;color:var(--gold);border:1px solid #3a3426;border-radius:99px;padding:6px 12px;white-space:nowrap}
.banners{margin-top:18px;position:relative}
.bn-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none}
.bn-track::-webkit-scrollbar{display:none}
.bn{flex:0 0 100%;scroll-snap-align:center;min-height:150px;border-radius:var(--r);background:linear-gradient(135deg,#111 0%,#2b2415 60%,#6b5420 100%);color:#fff;display:flex;align-items:flex-end;padding:22px;position:relative;overflow:hidden}
.bn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bn span{position:relative;font:600 clamp(22px,5vw,32px)/1.15 var(--disp);max-width:20ch;text-shadow:0 1px 12px rgba(0,0,0,.45)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:#d8cfb9;transition:.2s}
.dots i.on{background:var(--gold);width:20px;border-radius:9px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:18px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:9px 18px;font-weight:500;color:var(--ink);text-decoration:none;font-size:14px}
.chip:hover{border-color:var(--gold)}
.search{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:12px 20px;font:inherit;margin-top:14px}
.search:focus{outline:2px solid var(--gold);outline-offset:1px}
section.marca{padding-top:30px;scroll-margin-top:12px}
.mh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mh .mark{width:40px;height:40px;font-size:14px;border-color:var(--ink);color:var(--ink)}
.mh h2{margin:0;font:600 26px/1.1 var(--disp)}
.mh p{margin:2px 0 0;color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ph{aspect-ratio:1/1;background:linear-gradient(135deg,#f3ecdb,#e6d9b8);position:relative;display:grid;place-items:center}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph b{font:600 34px var(--disp);color:var(--gold-d);opacity:.7}
.tag{position:absolute;top:10px;left:10px;background:var(--ink);color:var(--gold);border-radius:99px;padding:4px 11px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tag.low{left:auto;right:10px;background:var(--bad);color:#fff;text-transform:none;letter-spacing:0}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb h3{margin:0;font-size:15px;font-weight:600;line-height:1.25;text-wrap:balance}
.tono{color:var(--gold-d);font-size:13px;font-weight:500}
.desc{color:var(--mut);font-size:13px;line-height:1.35}
.unit{color:var(--mut);font-size:12px}
.price{font:600 20px var(--disp);margin-top:auto;padding-top:8px}
.add{margin-top:8px;border:0;background:var(--ink);color:#fff;border-radius:99px;padding:11px 14px;font-weight:600;font-size:14px;min-height:44px}
.add:hover{background:#2b2415}
.qty{margin-top:8px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1.5px solid var(--gold);border-radius:99px;padding:3px}
.qty button{width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);color:var(--gold);font-size:20px;line-height:1}
.qty button:disabled{opacity:.35}
.qty span{font-weight:600}
.rapido{display:flex;gap:6px;margin-top:6px}
.rapido button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 0;font-size:13px;font-weight:600;min-height:36px}
.rapido button:disabled{opacity:.35}
.maxi{display:block;text-align:center;font-size:12px;color:var(--bad);margin-top:4px}
.sk{aspect-ratio:3/4;border-radius:var(--r);background:linear-gradient(90deg,#f1ead9 25%,#f8f3e6 50%,#f1ead9 75%);background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
.empty{padding:40px 0;color:var(--mut);text-align:center}
footer{margin-top:44px;padding-block:28px;color:var(--mut);font-size:13px;text-align:center;border-top:1px solid var(--line)}
.fab{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20;pointer-events:none}
.fab button{pointer-events:auto;display:flex;width:100%;max-width:560px;margin:0 auto;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;border:1.5px solid var(--gold);border-radius:99px;padding:14px 22px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.fab button em{font-style:normal;color:var(--gold)}
.fab[hidden]{display:none}
.ov{position:fixed;inset:0;background:rgba(17,17,17,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:28px}}
.sh{display:flex;justify-content:space-between;align-items:center}
.sh h2{margin:0;font:600 24px var(--disp)}
.x{border:0;background:var(--card);border:1px solid var(--line);width:40px;height:40px;border-radius:50%;font-size:18px}
.line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .t{flex:1;min-width:0}.line .t b{display:block;font-size:14px}.line .t small{color:var(--mut)}
.line .qty{margin:0;min-width:116px}
.line .sub{font-weight:600;min-width:84px;text-align:right;font-size:14px}
@media(max-width:480px){.line{flex-wrap:wrap}.line .t{flex:1 1 100%}.line .qty{flex:1}}
.tot{display:flex;justify-content:space-between;font:600 22px var(--disp);padding:16px 0 4px}
.note{font-size:12px;color:var(--mut);margin:0 0 6px}
.warn{background:#fbeceb;color:var(--bad);border-radius:14px;padding:10px 14px;font-size:14px;margin:10px 0}
.fld{display:grid;gap:12px;margin-top:14px}
.fld label{display:grid;gap:5px;font-size:13px;color:var(--mut);font-weight:500}
.fld input,.fld select,.fld textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;min-height:46px;width:100%}
.fld textarea{min-height:70px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.fld .mal{border-color:var(--bad);animation:tiembla .3s}
@keyframes tiembla{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){.fld .mal{animation:none}}
.trampa{position:absolute!important;left:-9999px;width:1px;height:1px;opacity:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.two{grid-template-columns:1fr}}
.send{width:100%;margin-top:16px;border:0;background:var(--ink);color:var(--gold);border-radius:99px;padding:16px;font-weight:600;font-size:16px;min-height:52px}
.send:disabled{background:#cfc8b8;color:#fff}
.sec{display:block;text-align:center;text-decoration:none;width:100%;margin-top:10px;border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:13px;font-weight:600;color:var(--ink)}
.wa{background:#1f7a3f;color:#fff;border:0;border-radius:99px;padding:16px;font-weight:600;font-size:16px;display:block;text-align:center;text-decoration:none;margin-top:14px}
.okbox{text-align:center;padding:10px 0 4px}
.okbox svg{width:64px;height:64px;stroke:var(--gold-d);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.okbox h3{font:600 26px var(--disp);margin:8px 0 4px}
.okbox p{margin:4px 0;color:var(--mut)}
.msg{font-size:14px;color:var(--ok);margin-top:10px;min-height:20px}
.err{min-height:60vh;display:grid;place-items:center;text-align:center;padding:24px}
.err h2{font:600 28px var(--disp);margin:0 0 8px}
.aviso{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:99px;padding:12px 20px;font-size:14px;z-index:40;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
.aviso.on{opacity:1}
</style>
</head>
<body>
<header><div class="wrap hd">
  <div class="mark">DS</div>
  <div><h1 id="nombre">Distrisander Cosméticos</h1><small>Calidez · Belleza natural · Frescura</small></div>
  <div class="who" id="who" hidden></div>
</div></header>

<main class="wrap" id="app"><div class="grid" style="margin-top:24px"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></main>
<footer><div class="wrap">Distrisander Cosméticos · Bucaramanga · Precios con IVA incluido</div></footer>
<div class="aviso" id="aviso" role="status"></div>

<div class="fab" id="fab" hidden><button id="fabBtn"><span id="fabN">0 productos</span><em id="fabT">$0</em></button></div>

<div class="ov" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Tu pedido">
  <div class="sh"><h2>Tu pedido</h2><button class="x" id="close" aria-label="Cerrar">✕</button></div>
  <div id="cuerpo"></div>
</div></div>

<script>
(function(){
'use strict';
/* Servidor (Apps Script de Distrisander). Para cambiarlo basta esta línea. */
var API='https://script.google.com/macros/s/AKfycbwo0_mg4rXAew1Sb1abzeFUD99gw8X65bDqizjIxaVYty60FjzlbSHhQMpOHHJXr2XW0w/exec';
var $=function(s){return document.querySelector(s)};
var cop=function(n){return '$ '+Math.round(n||0).toLocaleString('es-CO')};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var guardar=function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
var leer=function(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
var pausa=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var CLAVE=(new URLSearchParams(location.search).get('k')||'').replace(/[^A-Za-z0-9]/g,'').slice(0,40);
var K_CAT='ds_cat_'+CLAVE,K_CAR='ds_carrito_'+CLAVE,K_CLI='ds_cliente';
var CAT=null,P={},CART={},IDEM='',filtro='',ULT=null;

/* ——— Servidor: reintentos con espera; el pedido lleva llave para que NUNCA se duplique (de KAÉM) ——— */
function api(action,data,idem){
  var intento=0,enCurso=0;
  function una(){
    intento++;
    var ctrl=window.AbortController?new AbortController():null,t=setTimeout(function(){if(ctrl)ctrl.abort()},45000);
    return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',cache:'no-store',signal:ctrl?ctrl.signal:undefined,
      body:JSON.stringify({action:action,data:data,idem:idem||undefined})})
      .then(function(r){return r.text()})
      .then(function(txt){clearTimeout(t);var j;try{j=JSON.parse(txt)}catch(e){throw new Error('respuesta')}return j})
      .then(function(j){if(j&&j.enCurso&&enCurso<8){enCurso++;intento--;return pausa(2500).then(una)}return j})
      .catch(function(e){
        clearTimeout(t);
        var puede=intento<3&&navigator.onLine!==false&&(action!=='enviarPedido'||!!idem);
        if(puede)return pausa(900*intento+Math.floor(Math.random()*400)).then(una);
        throw e;
      });
  }
  return una();
}

function aviso(msg){var a=$('#aviso');a.textContent=msg;a.classList.add('on');clearTimeout(a._t);a._t=setTimeout(function(){a.classList.remove('on')},Math.min(7000,2400+msg.length*45))}
function pantallaError(h,p){$('#app').innerHTML='<div class="err"><div><h2>'+esc(h)+'</h2><p>'+esc(p)+'</p></div></div>';$('#fab').hidden=true}

/* ——— Carga en dos tiempos: primero lo guardado (instantáneo), luego lo fresco del servidor ——— */
function cargar(){
  if(!CLAVE){pantallaError('Este enlace está incompleto','Pídele a tu asesor de Distrisander el enlace de tu catálogo.');return}
  var previo=leer(K_CAT);
  if(previo&&previo.ok)aplicar(previo);
  api('catalogoPublico',{clave:CLAVE}).then(function(r){
    if(!r||!r.ok){
      if(r&&/no es válido|venció|no está disponible/i.test(r.message||'')){   // enlace cambiado o apagado: se borra lo guardado (precios y pedido)
        try{localStorage.removeItem(K_CAT);localStorage.removeItem(K_CAR)}catch(e){}
        CAT=null;CART={};pantallaError('Este enlace no está activo',r.message);return;
      }
      if(!previo)pantallaError('No pudimos cargar el catálogo',(r&&r.message)||'Intenta de nuevo en un momento.');
      else aviso((r&&r.message)||'No se pudo actualizar el catálogo.');
      return;
    }
    guardar(K_CAT,r);aplicar(r);
  }).catch(function(){
    if(!previo)pantallaError('No pudimos conectar','Revisa tu internet y vuelve a intentar.');
    else aviso('Sin conexión: te mostramos el último catálogo guardado.');
  });
}
function aplicar(r){
  CAT=r;P={};
  r.productos.forEach(function(p){P[p.codigo]=p});
  var c=leer(K_CAR)||{};CART={};
  Object.keys(c).forEach(function(k){if(P[k]&&c[k]>0)CART[k]=Math.min(c[k],P[k].disponible)});   // el carrito se ajusta al stock de hoy
  $('#nombre').textContent=r.nombre||'Distrisander Cosméticos';
  var w=$('#who');w.hidden=false;w.textContent=r.vendedorId==='detal'?'Catálogo Detal':'Asesor: '+r.vendedor;
  document.title=(r.nombre||'Distrisander Cosméticos');
  render();
}

function label(p){return p.unidad_venta==='caja'?'Caja x'+p.por_caja+' unidades':'Unidad'}
function bannersHtml(){
  var bs=CAT.banners||[];if(!bs.length)return '';
  var h='<div class="banners"><div class="bn-track" id="bnT">';
  bs.forEach(function(b){h+='<div class="bn">'+(b.imagen?'<img src="img/banners/'+esc(b.imagen)+'" alt="" onerror="this.remove()">':'')+'<span>'+esc(b.titulo)+'</span></div>'});
  h+='</div>';
  if(bs.length>1){h+='<div class="dots" id="dots">';bs.forEach(function(_,i){h+='<i'+(i===0?' class="on"':'')+'></i>'});h+='</div>'}
  return h+'</div>';
}
function cardHtml(p){
  var a=p.disponible,n=CART[p.codigo]||0,low=a<=(CAT.pocas||12);
  var ph='<div class="ph"><b>'+esc((p.marca||'?').slice(0,1))+'</b>'+(p.foto?'<img loading="lazy" src="img/productos/'+esc(p.foto)+'" alt="'+esc(p.nombre)+'" onerror="this.remove()">':'')
    +(p.novedad?'<span class="tag">Novedad</span>':'')+(low?'<span class="tag low">Quedan '+a+'</span>':'')+'</div>';
  var tope=n>=a;
  var ctl=n?'<div class="qty"><button data-m="'+esc(p.codigo)+'" aria-label="Quitar uno">−</button><span>'+n+'</span><button data-p="'+esc(p.codigo)+'" aria-label="Agregar uno"'+(tope?' disabled':'')+'>+</button></div>'+(tope?'<span class="maxi">Unidades máximas</span>':'')
    :'<button class="add" data-p="'+esc(p.codigo)+'">Agregar</button>';
  var rap=(p.por_caja===1&&a>6)?'<div class="rapido">'+[6,12].map(function(k){return '<button type="button" data-s="'+k+'" data-c="'+esc(p.codigo)+'"'+(n+k>a?' disabled':'')+'>+'+k+'</button>'}).join('')+'</div>':'';
  return '<article class="card"><div class="phw">'+ph+'</div><div class="cb"><h3>'+esc(p.nombre)+'</h3>'
    +(p.tono?'<div class="tono">'+esc(p.tono)+'</div>':'')+(p.descripcion?'<div class="desc">'+esc(p.descripcion)+'</div>':'')
    +'<div class="unit">'+label(p)+'</div><div class="price">'+cop(p.precio)+'</div>'+ctl+rap+'</div></article>';
}
function grids(){
  var h='',any=false,q=filtro;
  CAT.marcas.forEach(function(m){
    var ps=CAT.productos.filter(function(p){return p.marca===m.marca&&(!q||(p.nombre+' '+p.tono+' '+p.descripcion).toLowerCase().indexOf(q)>-1)});
    if(!ps.length)return;any=true;
    h+='<section class="marca" id="m-'+esc(m.marca.replace(/\W+/g,'-'))+'"><div class="mh"><div class="mark">'+esc(m.marca.slice(0,2).toUpperCase())+'</div><div><h2>'+esc(m.marca)+'</h2>'+(m.descripcion?'<p>'+esc(m.descripcion)+'</p>':'')+'</div></div><div class="grid">'+ps.map(cardHtml).join('')+'</div></section>';
  });
  if(any)return h;
  return '<div class="empty">'+(CAT.productos.length?'No encontramos productos con esa búsqueda.':'No hay productos disponibles en este momento.')+'</div>';
}
function render(){
  var chips=CAT.marcas.filter(function(m){return CAT.productos.some(function(p){return p.marca===m.marca})}).map(function(m){return '<a class="chip" href="#m-'+esc(m.marca.replace(/\W+/g,'-'))+'">'+esc(m.marca)+'</a>'}).join('');
  $('#app').innerHTML=bannersHtml()+'<div class="chips">'+chips+'</div><input class="search" id="q" type="search" placeholder="Buscar producto o tono" aria-label="Buscar" value="'+esc(filtro)+'"><div id="grids">'+grids()+'</div>';
  wire();fab();
}
function refresh(){$('#grids').innerHTML=grids();fab()}

function lineas(){return Object.keys(CART).map(function(c){var p=P[c];return p&&CART[c]>0?{p:p,n:CART[c],sub:p.precio*CART[c]}:null}).filter(Boolean)}
function total(){return lineas().reduce(function(s,l){return s+l.sub},0)}
function fab(){
  var ls=lineas(),n=ls.reduce(function(s,l){return s+l.n},0);
  $('#fab').hidden=!n;$('#fabN').textContent=n+(n===1?' producto':' productos')+' · Ver pedido';$('#fabT').textContent=cop(total());
}
function setQty(c,d){
  var p=P[c];if(!p)return;
  var n=Math.max(0,Math.min(p.disponible,(CART[c]||0)+d));
  if(d>0&&n===(CART[c]||0))aviso('Llegaste a las unidades máximas de este producto.');
  if(n)CART[c]=n;else delete CART[c];
  IDEM='';                       // el pedido cambió: el próximo envío es nuevo
  guardar(K_CAR,CART);refresh();if(!$('#ov').hidden)drawer();
}
function wire(){
  var t=$('#bnT');
  if(t){var dots=document.querySelectorAll('#dots i');
    t.addEventListener('scroll',function(){var i=Math.round(t.scrollLeft/t.clientWidth);dots.forEach(function(d,k){d.classList.toggle('on',k===i)})});
    if(dots.length>1)setInterval(function(){var i=(Math.round(t.scrollLeft/t.clientWidth)+1)%dots.length;t.scrollTo({left:i*t.clientWidth,behavior:'smooth'})},5000)}
  $('#q').addEventListener('input',function(e){filtro=e.target.value.trim().toLowerCase();$('#grids').innerHTML=grids()});
  $('#app').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.p)setQty(b.dataset.p,1);else if(b.dataset.m)setQty(b.dataset.m,-1);else if(b.dataset.s)setQty(b.dataset.c,Number(b.dataset.s));
  });
}

/* ——— Hoja del pedido ——— */
var CAMPOS=['negocio','recibe','cedula_nit','telefono','direccion','ciudad_barrio','forma_pago','observaciones'];
var ID_CAMPO={negocio:'f_negocio',recibe:'f_recibe',cedula_nit:'f_nit',telefono:'f_tel',direccion:'f_dir',ciudad_barrio:'f_ciudad',forma_pago:'f_pago'};
function val(id){return String((document.getElementById(id)||{}).value||'').trim()}
function drawer(){
  var ls=lineas(),min=CAT.pedidoMinimo||0,tot=total(),falta=min-tot,corto=ls.length&&falta>0,c=leer(K_CLI)||{};
  var campo=function(k,lbl,extra){return '<label>'+lbl+'<input id="'+ID_CAMPO[k]+'" value="'+esc(c[k]||'')+'" '+(extra||'')+'></label>'};
  var h=ls.length?ls.map(function(l){
    return '<div class="line"><div class="t"><b>'+esc(l.p.nombre)+'</b><small>'+(l.p.tono?esc(l.p.tono)+' · ':'')+label(l.p)+' · '+cop(l.p.precio)+'</small></div>'
    +'<div class="qty"><button data-m="'+esc(l.p.codigo)+'" aria-label="Quitar uno">−</button><span>'+l.n+'</span><button data-p="'+esc(l.p.codigo)+'" aria-label="Agregar uno"'+(l.n>=l.p.disponible?' disabled':'')+'>+</button></div><div class="sub">'+cop(l.sub)+'</div></div>'}).join('')
    :'<div class="empty">Tu pedido está vacío.</div>';
  h+='<div class="tot"><span>Total</span><span>'+cop(tot)+'</span></div><p class="note">Total de referencia con IVA incluido. Los descuentos se aplican al facturar.</p>';
  if(corto)h+='<div class="warn">El pedido mínimo es de '+cop(min)+'. Te faltan '+cop(falta)+'.</div>';
  h+='<form class="fld" id="form" autocomplete="on" novalidate>'
    +campo('negocio','Nombre del negocio','required autocomplete="organization" maxlength="120"')
    +campo('recibe','Quién atiende o recibe','required autocomplete="name" maxlength="80"')
    +'<div class="two">'+campo('cedula_nit','Cédula o NIT'+(CAT.vendedorId==='detal'?' (opcional)':''),'inputmode="numeric" maxlength="20"')+campo('telefono','Celular (10 dígitos)','required type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="3001234567"')+'</div>'
    +campo('direccion','Dirección','required autocomplete="street-address" maxlength="200"')
    +campo('ciudad_barrio','Ciudad o barrio','required maxlength="80"')
    +'<label>Forma de pago<select id="f_pago"><option value="">Elige una</option>'+['Contado','Crédito a 30 días','Transferencia o consignación'].map(function(x){return '<option'+(c.forma_pago===x?' selected':'')+'>'+x+'</option>'}).join('')+'</select></label>'
    +'<label>Observaciones (opcional)<textarea id="f_obs" maxlength="300"></textarea></label>'
    +'<input class="trampa" id="f_web" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">'
    +'<button class="send" id="send" type="submit"'+(!ls.length||corto?' disabled':'')+'>Enviar pedido</button>'
    +'<p class="note" style="text-align:center;margin-top:10px">Tu pedido queda guardado y llega a tu asesor '+esc(CAT.vendedorId==='detal'?'de Distrisander':CAT.vendedor)+'. Luego lo envías por WhatsApp para confirmarlo.</p>'
    +'<div class="msg" id="sentMsg" role="status"></div></form>';
  $('#cuerpo').innerHTML=h;
}
function abrir(){drawer();$('#ov').hidden=false;document.body.style.overflow='hidden'}
function cerrar(){$('#ov').hidden=true;document.body.style.overflow=''}
function recordar(){var o={};CAMPOS.forEach(function(k){if(k!=='observaciones')o[k]=val(ID_CAMPO[k])});guardar(K_CLI,o)}
function marcar(campo){var el=document.getElementById(ID_CAMPO[campo]);if(!el)return;el.classList.remove('mal');void el.offsetWidth;el.classList.add('mal');el.focus()}

function enviar(){
  var s=$('#send');
  if(s.disabled)return;          // sin productos o por debajo del mínimo: no se envía (aunque el formulario se dispare por otro lado)
  var cli={negocio:val('f_negocio'),recibe:val('f_recibe'),cedula_nit:val('f_nit'),telefono:val('f_tel'),direccion:val('f_dir'),ciudad_barrio:val('f_ciudad')};
  var obligatorios=[['negocio',cli.negocio],['recibe',cli.recibe],['cedula_nit',cli.cedula_nit||(CAT.vendedorId==='detal'?'x':'')],['telefono',cli.telefono],['direccion',cli.direccion],['ciudad_barrio',cli.ciudad_barrio],['forma_pago',val('f_pago')]];
  for(var i=0;i<obligatorios.length;i++)if(!obligatorios[i][1]){marcar(obligatorios[i][0]);aviso('Completa este dato para enviar tu pedido.');return}
  recordar();
  s.disabled=true;s.textContent='Enviando…';
  var items=Object.keys(CART).map(function(c){return {codigo:c,cantidad:CART[c]}});
  if(!IDEM)IDEM='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  api('enviarPedido',{clave:CLAVE,cliente:cli,items:items,forma_pago:val('f_pago'),observaciones:val('f_obs'),web:val('f_web')},IDEM).then(function(r){
    if(!r||!r.ok){
      s.disabled=false;s.textContent='Enviar pedido';
      aviso((r&&r.message)||'No se pudo enviar el pedido.');
      if(r&&r.campo)marcar(r.campo);
      if(r&&/solo quedan|ya no está disponible|actualiza/i.test(r.message||''))cargar();   // el stock cambió: se refresca el catálogo
      return;
    }
    exito(r,cli,val('f_pago'),val('f_obs'));
  }).catch(function(){s.disabled=false;s.textContent='Enviar pedido';aviso('No pudimos conectar. Revisa tu internet e intenta de nuevo; tu pedido sigue guardado.')});
}
function textoWsp(r,cli,pago,obs){
  var t='*PEDIDO DISTRISANDER* '+r.id+'\n'+(CAT.vendedorId==='detal'?'Catálogo: Detal':'Asesor: '+r.vendedor)+'\n\n';
  t+='*Cliente*\nNegocio: '+cli.negocio+'\nRecibe: '+cli.recibe+'\nCédula/NIT: '+(cli.cedula_nit||'—')+'\nTeléfono: '+cli.telefono+'\nDirección: '+cli.direccion+'\nCiudad/barrio: '+cli.ciudad_barrio+'\nForma de pago: '+pago+'\n';
  if(obs)t+='Observaciones: '+obs+'\n';
  t+='\n*Productos*\n';
  r.lineas.forEach(function(l){t+='• '+l.cantidad+' × '+l.nombre+(l.tono?' ('+l.tono+')':'')+' · '+(l.unidad_venta==='caja'?'Caja x'+l.por_caja:'Unidad')+' · '+cop(l.precio)+' = '+cop(l.subtotal)+'\n'});
  return t+'\n*Total de referencia: '+cop(r.total)+'* (IVA incluido)';
}
function exito(r,cli,pago,obs){
  CART={};IDEM='';guardar(K_CAR,CART);refresh();
  var txt=textoWsp(r,cli,pago,obs),url='https://wa.me/57'+String(r.destino||'').replace(/\D/g,'')+'?text='+encodeURIComponent(txt);
  var primer=(cli.recibe||'').split(' ')[0];primer=primer.charAt(0).toUpperCase()+primer.slice(1).toLowerCase();
  $('#cuerpo').innerHTML='<div class="okbox"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="29"/><path d="M19 33l9 9 17-19"/></svg>'
    +'<h3>¡Listo'+(primer?', '+esc(primer):'')+'!</h3><p>Tu pedido <b>'+esc(r.id)+'</b> quedó guardado.</p><p>Total '+cop(r.total)+' · '+r.unidades+' unidades</p>'
    +'<p>Envíalo ahora por WhatsApp a tu asesor para confirmarlo.</p></div>'
    +'<a class="wa" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Enviar por WhatsApp</a>'
    +'<button class="sec" id="copiar" type="button">Copiar el pedido</button><div class="msg" id="sentMsg" role="status"></div>'
    +'<button class="sec" id="seguir" type="button">Seguir viendo el catálogo</button>';
  $('#copiar').addEventListener('click',function(){
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){$('#sentMsg').textContent='Pedido copiado. Pégalo en el chat de WhatsApp.'},function(){window.prompt('Copia el pedido:',txt)});
  });
  $('#seguir').addEventListener('click',cerrar);
}

$('#fabBtn').addEventListener('click',abrir);
$('#close').addEventListener('click',cerrar);
$('#ov').addEventListener('click',function(e){if(e.target.id==='ov')cerrar()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')cerrar()});
$('#cuerpo').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.p)setQty(b.dataset.p,1);else if(b.dataset.m)setQty(b.dataset.m,-1)});
$('#cuerpo').addEventListener('submit',function(e){e.preventDefault();enviar()});
$('#cuerpo').addEventListener('input',function(e){if(e.target.closest&&e.target.closest('#form')&&e.target.classList)e.target.classList.remove('mal')});
cargar();
})();
</script>
</body>
</html>
